server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: appointment-service
  datasource:
    url: ${APPOINTMENT_DB_URL:jdbc:postgresql://localhost:5432/careflow_appointment}
    username: ${APPOINTMENT_DB_USERNAME:careflow}
    password: ${APPOINTMENT_DB_PASSWORD:careflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    schemas: public
    out-of-order: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:admin}}
    password: ${RABBITMQ_PASSWORD:admin123}
    publisher-confirm-type: correlated
    publisher-returns: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    registry-fetch-interval-seconds: 3
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

appointment:
  outbox-poll-ms: ${APPOINTMENT_OUTBOX_POLL_MS:1000}
  outbox-max-attempts: ${APPOINTMENT_OUTBOX_MAX_ATTEMPTS:12}
  max-appointments-per-slot: ${APPOINTMENT_MAX_APPOINTMENTS_PER_SLOT:5}
