server:
  port: 8090

spring:
  application:
    name: hospital-directory-service
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: ${DIRECTORY_DB_URL:jdbc:postgresql://100.116.233.60:5432/careflow_hospital_directory}
    username: careflow
    password: careflow
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
