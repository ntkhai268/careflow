server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${IDENTITY_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/careflow_identity}}
    username: ${SPRING_DATASOURCE_USERNAME:${IDENTITY_DB_USERNAME:careflow}}
    password: ${SPRING_DATASOURCE_PASSWORD:${IDENTITY_DB_PASSWORD:careflow}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    baseline-on-migrate: true
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:careflow_super_secret_jwt_key_2026_very_long_secret_key_minimum_256_bits}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  issuer: careflow-identity

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
