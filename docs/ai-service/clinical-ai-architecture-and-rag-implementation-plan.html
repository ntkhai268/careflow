ring contextText = topChunks.stream()\n            .map(c -> String.format(\"[Trích dẫn: %s]\\n%s\", c.getSectionTitle(), c.getContent()))\n            .collect(Collectors.joining(\"\\n\\n---\\n\\n\"));\n\n        // 4. Lắp ráp Prompt Guardrails nghiêm ngặt\n        String prompt = String.format(\"\"\"\n            BẠN LÀ TRỢ LÝ HỖ TRỢ QUYẾT ĐỊNH LÂM SÀNG (CDSS) TẠI BỆNH VIỆN CAREFLOW.\n            \n            [QUY TẮC BẮT BUỘC]:\n            1. CHỈ đưa ra khuyến nghị dựa trên PHÁC ĐỒ BỘ Y TẾ được cung cấp dưới đây. KHÔNG tự suy diễn.\n            2. Gắn kèm mã trích dẫn nguồn [Tên tài liệu / Mục] ở từng khuyến nghị.\n            3. Nếu phát hiện tương tác thuốc hoặc chống chỉ định, in đậm [CẢNH BÁO NGUY CƠ CAO].\n            4. Nhắc nhở: \"Bác sĩ là người chịu trách nhiệm lâm sàng cuối cùng\".\n            \n            [PHÁC ĐỒ BỘ Y TẾ LIÊN QUAN]:\n            %s\n            \n            [NGỮ CẢNH BỆNH NHÂN HIỆN TẠI (TỪ ZUSTAND STORE)]:\n            %s\n            \n            [YÊU CẦU CỦA BÁC SĨ]:\n            %s\n            \"\"\", contextText, clinicalSnapshotJson, doctorQuery);\n\n        // 5. Gọi LLM Gemini 2.5 Flash\n        var response = geminiClient.models.generateContent(\"gemini-2.5-flash\", prompt, null);\n        return response.text();\n    }\n\n    private String formatVectorForSql(float[] vector) {\n        StringBuilder sb = new StringBuilder(\"[\");\n        for (int i = 0; i < vector.length; i++) {\n            sb.append(vector[i]);\n            if (i < vector.length - 1) sb.append(\",\");\n        }\n        sb.append(\"]\");\n        return sb.toString();\n    }\n}\n```\n\n---\n\n### 9.6. [Phase 5: Generation & Verification] Kịch Bản Kiểm Thử Thực Tế Dịch Vụ Doctor AI Chat (End-to-End Testing)\n\nSau khi hoàn thành các bước trên, nhóm có thể thực hiện kiểm thử theo **4 bước tuần tự** để đảm bảo dịch vụ chạy chính xác:\n\n#### Bước 1: Kiểm thử CSDL Vector bằng câu lệnh SQL\nMở DBeaver/psql và chạy thử một câu truy vấn tìm kiếm ngữ nghĩa giả lập câu hỏi của Bác sĩ:\n```sql\n-- Tìm phác đồ xử trí sốt xuất huyết có dấu hiệu cảnh báo\nSELECT \n    section_title, \n    content,\n    1 - (embedding <=> (SELECT embedding FROM clinical_guideline_chunks LIMIT 1)) AS similarity\nFROM clinical_guideline_chunks\nORDER BY similarity DESC\nLIMIT 2;\n```\n* **Kỳ vọng:** Database trả về đúng trích đoạn về *\"Dấu hiệu cảnh báo Sốt xuất huyết Dengue\"* và *\"Chỉ định truyền dịch Ringer Lactate\"*.\n\n#### Bước 2: Kiểm thử API Backend qua cURL\nGửi một request giả lập Bác sĩ đang khám bệnh nhân sốt xuất huyết:\n\n```bash\ncurl -X POST http://localhost:8085/api/ai/clinical-suggestions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer <DOCTOR_JWT_TOKEN>\" \\\n  -d '{\n    \"consultationId\": \"c1000000-0000-0000-0000-000000000001\",\n    \"question\": \"Bệnh nhân sốt ngày thứ 4, tiểu cầu giảm 80.000, đau bụng vùng gan. Cần xử trí gì?\",\n    \"clinicalSnapshot\": {\n      \"patient\": {\"fullName\": \"Nguyễn Văn A\", \"age\": 28, \"gender\": \"MALE\"},\n      \"vitals\": {\"spo2\": 97, \"temperature\": 38.5, \"bloodPressure\": \"110/70\", \"heartRate\": 88},\n      \"symptoms\": \"Sốt cao liên tục 4 ngày, đau mỏi cơ, đau hạ sườn phải\",\n      \"diagnose\": \"Theo dõi Sốt xuất huyết Dengue\"\n    }\n  }'\n```\n\n* **Tiêu chí Đạt (Pass Criteria)**:\n  1. **Độ trễ phản hồi**: $\\le$ 2.0 giây.\n  2. **Trích dẫn rõ ràng**: Nội dung câu trả lời có trích dẫn đúng `[Quyết định 4068/QĐ-BYT > Dấu hiệu cảnh báo]`.\n  3. **Đúng chuyên môn**: Khuyên cho bệnh nhân nhập viện theo dõi, chỉ định xét nghiệm công thức máu, truyền dịch đúng tốc độ phác đồ quy định.\n\n#### Bước 3: Kiểm thử Chặn Ảo Giác (Anti-Hallucination & Guardrails Test)\nGửi một câu hỏi lâm sàng về một loại thuốc không có trong phác đồ điều trị được nạp (ví dụ hỏi dùng kháng sinh liều cao cho sốt xuất huyết):\n* **Kỳ vọng:** Trợ lý AI phát hiện đây là bệnh do virus Dengue, **từ chối gợi ý kháng sinh** và cảnh báo rõ ràng dựa trên phác đồ của Bộ Y Tế.\n\n#### Bước 4: Kiểm thử Tương Tác Trực Tiếp Trên Giao Diện Web (`doctor-web`)\n1. Bác sĩ mở trang khám bệnh: `http://localhost:3000/consultation/c1000000-0000-0000-0000-000000000001`.\n2. Nhập các chỉ số sinh hiệu (SpO2, Huyết áp, Thân nhiệt) và gõ chẩn đoán tạm thời.\n3. Bấm chuyển sang Tab **\"🤖 Trợ lý AI\"** (hoặc mở Widget AI ở góc dưới bên phải):\n   * Xác nhận không bị giật lag giao diện (0% re-render).\n   * Thấy AI tự động tải câu trả lời gợi ý phác đồ, liều dùng thuốc và cảnh báo tương tác.\n   * Thử nút **\"Sao chép vào bệnh án\"** $\\rightarrow$ Dữ liệu gợi ý được điền tự động vào ô ghi chú lâm sàng của Bác sĩ.\n\n---\n\n## 10. Tài Liệu Tham Khảo & Căn Cứ Chuẩn Hóa (References & Industry Benchmarks)\n\nHệ thống **Clinical RAG & AI Decision Support System** của CareFlow được nghiên cứu và thiết kế dựa trên các tiêu chuẩn kỹ thuật công nghiệp hàng đầu thế giới kết hợp với quy chuẩn chuyên môn y tế chính thức tại Việt Nam:\n\n1. **Chuẩn Mực Kiến Trúc RAG Công Nghiệp (Industry Reference Benchmark)**:\n   * **Databricks Engineering**: [*End-to-End RAG Workflow: How Retrieval Augmented Generation Works*](https://www.databricks.com/blog/rag-workflow).\n     * *Giá trị tham chiếu*: Là căn cứ kiến trúc cốt lõi định hình quy trình **5 giai đoạn (5-Stage RAG Pipeline)** của CareFlow: *Ingestion $\\rightarrow$ Chunking & Embedding $\\rightarrow$ Hybrid Retrieval (Vector + BM25 via RRF) $\\rightarrow$ Context Augmentation $\\rightarrow$ Grounded Generation*.\n     * *Nguyên lý áp dụng*: Khẳng định ưu thế vượt trội của RAG đối với tri thức động không cần huấn luyện lại (*Zero Model Retraining*), vai trò của Hybrid Search trong việc bắt chính xác thực thể hiếm, và nguyên tắc lọc ngưỡng an toàn (*Similarity Cutoff*) để triệt tiêu ảo giác.\n2. **Cơ Sở Y Khoa & Phác Đồ Bộ Y Tế Việt Nam (Clinical Guidelines & Drug Formulary)**:\n   * **Cục Quản lý Khám, Chữa bệnh — Bộ Y Tế Việt Nam**: Cổng thông tin phác đồ chính thống ([`kcb.vn`](https://kcb.vn)).\n     * *Quyết định số 4800/QĐ-BYT*: Hướng dẫn chẩn đoán và điều trị một số bệnh về Hô hấp.\n     * *Quyết định số 4068/QĐ-BYT (2023)*: Hướng dẫn chẩn đoán, điều trị Sốt xuất huyết Dengue.\n     * *Quyết định số 5968/QĐ-BYT*: Hướng dẫn chẩn đoán và điều trị Tăng huyết áp người lớn.\n     * *Quyết định số 5481/QĐ-BYT*: Hướng dẫn chẩn đoán và điều trị Đái tháo đường Type 2.\n   * **Dược thư Quốc gia Việt Nam (Bản mới nhất)**: Bộ Y Tế & Hội đồng Dược thư Quốc gia ban hành — Chuyên luận thuốc, chỉ định, chống chỉ định và tương tác thuốc (DDI).\n3. **Nghiên Cứu RAG Trong Y Tế Lâm Sàng Quốc Tế (Clinical AI Research)**:\n   * **Stanford Medicine & MedRAG**: *Benchmarking Retrieval-Augmented Generation for Medicine* — Nghiên cứu chỉ ra RAG giảm thiểu 90% ảo giác lâm sàng so với mô hình LLM đơn lẻ.\n   * **Nature Medicine / NEJM AI**: Các hướng dẫn triển khai hệ thống hỗ trợ quyết định lâm sàng (Clinical Decision Support - CDS) có sự giám sát của con người (*Human-in-the-loop*).\n4. **Hạ Tầng Dữ Liệu & Chỉ Mục Vector (Vector Infrastructure)**:\n   * **PostgreSQL pgvector Extension**: [*pgvector: Open-source vector similarity search for Postgres*](https://github.com/pgvector/pgvector) — Giải thuật chỉ mục HNSW (Hierarchical Navigable Small World) cho tìm kiếm vector độ trễ thấp $< 15\\text{ms}$.\n   * **BAAI General Embedding (BGE-M3)**: *Multi-Lingual, Multi-Functionality, Multi-Granularity Text Embeddings* (Dense + Sparse Multi-Retrieval).\n";

    mermaid.initialize({

    function changeFontSize(delta) {
