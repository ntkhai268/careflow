\n\n\n<div class=\"callout callout-important\"><strong>⚠️ QUAN TRỌNG:</strong><br/>**NGUYÊN TẮC KIỂM SOÁT PHẠM VI (SCOPE CONTROL): \"FUNCTIONAL FIRST\"**  \nĐể tránh dự án bị sa lầy do phạm vi quá lớn ngay từ đầu (scope creep), nhóm tập trung hoàn thiện **Bộ ba tính năng P0 (MVP)** để hệ thống chạy thông suốt, phục vụ trực tiếp thao tác của Bác sĩ trước. Toàn bộ các kỹ thuật tối ưu hóa phức tạp sẽ được phát triển tuần tự ở các phase sau.\n</div>\n\n\n| Mức Độ Ưu Tiên | Phân Hệ / Tính Năng | Mục Tiêu Kỹ Thuật Cụ Thể | Trạng Thái Mục Tiêu (MVP) |\n|---|---|---|---|\n| **P0 (Ưu tiên cao nhất)** | **1. Zustand Clinical Store** | - Lưu trữ toàn bộ sinh hiệu thực tế (**SpO2, Thân nhiệt, Huyết áp, Nhịp tim**) và **Chẩn đoán tạm thời (`diagnose`)**.<br/>- Đảm bảo 0% giật lag re-render form nhập liệu.<br/>- Xuất JSON snapshot sạch phục vụ AI. | **BẮT BUỘC FUNCTIONAL** (Chạy hoàn chỉnh trước) |\n| **P0 (Ưu tiên cao nhất)** | **2. Clinical RAG Cơ Bản** | - Nạp 3-5 phác đồ điều trị nền tảng của Bộ Y Tế & Dược thư vào PostgreSQL `pgvector`.<br/>- Bác sĩ bấm sang Tab \"🤖 Trợ lý AI\", hệ thống tự động kéo snapshot Zustand đối chiếu với phác đồ để trả về gợi ý chẩn đoán phân biệt, cảnh báo tương tác thuốc có trích dẫn nguồn. | **BẮT BUỘC FUNCTIONAL** (Chạy hoàn chỉnh trước) |\n| **P0 (Ưu tiên cao nhất)** | **3. Voice ➔ Text ➔ Tự Động Điền Form** | - Bác sĩ bấm micro nói triệu chứng / số đo sinh hiệu.<br/>- Chuyển thành văn bản và bóc tách thành JSON 11 trường lâm sàng.<br/>- **Tự động điền (Auto-fill)** chính xác vào các ô input trên màn hình khám bệnh (`consultation/[id]`). | **BẮT BUỘC FUNCTIONAL** (Chạy hoàn chỉnh trước) |\n| **P1 (Giai đoạn nâng cao)** | **4. Hybrid Search RRF & Re-ranking** | - Kết hợp Dense Vector Cosine với Full-Text Search (BM25) qua thuật toán RRF k=60.<br/>- Tích hợp Cross-Encoder Re-ranker (`bge-reranker-v2-m3`) để lọc Top 3 chunk phác đồ tối ưu. | Phase 2 (Phát triển sau khi P0 ổn định) |\n| **P1 (Giai đoạn nâng cao)** | **5. Metadata Pre-filtering Chuyên Khoa** | - Lọc trước các chunk tài liệu theo chuyên khoa (`specialty`) để thu hẹp phạm vi tìm kiếm dưới 200 chunks. | Phase 2 (Phát triển sau khi P0 ổn định) |\n| **P2 (Tối ưu & Mở rộng)** | **6. In-Memory Caching & Scale** | - Caching các cặp tương tác thuốc và phác đồ phổ biến qua Caffeine/Redis để phản hồi dưới 50ms. | Phase 3 (Mở rộng trong tương lai) |\n| **P2 (Tối ưu & Mở rộng)** | **7. Tải Model Về Huấn Luyện (Fine-tuning SLM)** | - Tải mô hình Open-Source (SLM 7B/8B như `Qwen2.5-7B`, `Llama-3.1-8B`) về máy chủ cục bộ.<br/>- Dùng kỹ thuật LoRA/QLoRA fine-tune trên dữ liệu bệnh án & văn phong y tế tiếng Việt để chuẩn hóa format và hiểu sâu từ viết tắt chuyên ngành. | Phase 3 (Mở rộng trong tương lai) |\n| **P2 (Tối ưu & Mở rộng)** | **8. On-Premise Whisper & Private Speech** | - Triển khai Whisper STT nội bộ trên máy chủ GPU bệnh viện để âm thanh giọng nói không bao giờ rời khỏi mạng nội bộ. | Phase 3 (Mở rộng trong tương lai) |\n| **Xuyên Suốt Toàn Bộ** | **🛡️ Chính Sách An Toàn AI: Bác Sĩ Quyết Định Cuối Cùng** | - **Nguyên tắc bất di bất dịch**: AI chỉ là trợ lý tham vấn (Decision Support). Bác sĩ là người duy nhất ra quyết định và chịu trách nhiệm pháp lý.<br/>- Cấm AI tự động ghi đè dữ liệu vào EMR hay tự ký đơn thuốc.<br/>- Giao diện yêu cầu Bác sĩ chủ động Review ➔ 1-click Accept / Edit. | **ÁP DỤNG XUYÊN SUỐT 100% CÁC PHASE** |\n\n---\n\n## 1. Tổng Quan Bài Toán & Kiến Trúc Tổng Thể\n\nTrong quy trình khám chữa bệnh tại CareFlow, Bác sĩ chịu áp lực thời gian lớn khi phải đồng thời:\n- Tiếp nhận và theo dõi các chỉ số sinh hiệu liên tục biến động (Huyết áp, Nhịp tim, Thân nhiệt, SpO2).\n- Khai thác bệnh sử, triệu chứng lâm sàng và đưa ra chẩn đoán sơ bộ.\n- Tra cứu phác đồ điều trị chuẩn của Bộ Y Tế, rà soát tương tác thuốc và chống chỉ định y khoa.\n\n### 1.1. Luồng Người Dùng Mục Tiêu (Target Clinical Flow)\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#FFFFFF', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B', 'clusterBkg': '#F8FAFC', 'clusterBorder': '#CBD5E1', 'titleColor': '#0F172A' }}}%%\nflowchart TD\n    subgraph Frontend[\"Frontend (doctor-web)\"]\n        Vitals[\"Bác sĩ nhập Sinh hiệu<br/>(SpO2, Temp, BP, Pulse)\"] --> Store[\"Zustand Global Store<br/>(useClinicalWorkspaceStore)\"]\n        Diagnosis[\"Bác sĩ nhập Triệu chứng<br/>& Chẩn đoán tạm thời\"] --> Store\n        SwitchTab[\"Bác sĩ bấm chuyển sang<br/>TAB '🤖 Trợ lý AI'\"] --> ReadSnapshot[\"Pull On-Demand Snapshot<br/>(Không re-render Form)\"]\n    end\n\n    subgraph Backend[\"Backend (careflow-ai-service)\"]\n        ReadSnapshot --> ApiCall[\"POST /api/ai/clinical-suggestions<br/>kèm Payload Ngữ Cảnh Động\"]\n        ApiCall --> QueryProcessor[\"RAG Query Processor<br/>(Bóc tách Thực thể Y tế)\"]\n        \n        subgraph RAG[\"Clinical RAG Engine\"]\n            QueryProcessor --> HybridSearch[\"Hybrid Search (RRF)<br/>Dense Cosine + Sparse BM25\"]\n            PgVector[(\"PostgreSQL + pgvector<br/>- Phác đồ Bộ Y Tế<br/>- Dược thư Quốc gia<br/>- ICD-10 & Tương tác thuốc\")] --> HybridSearch\n            HybridSearch --> Reranker[\"Cross-Encoder Reranker<br/>(BGE-Reranker-v2-m3)\"]\n            Reranker --> TopK[\"Top 3-5 Chunks Phác đồ<br/>Chính xác 100%\"]\n        end\n\n        TopK --> GroundedPrompt[\"Grounded Clinical Prompt<br/>(Ngữ cảnh Bệnh nhân + Phác đồ BYT)\"]\n        GroundedPrompt --> LLM[\"LLM Engine<br/>(Gemini 2.5 Flash / DeepSeek V3)\"]\n        LLM --> FormattedResponse[\"Response có Cấu trúc:<br/>- Tóm tắt Lâm sàng<br/>- Gợi ý Phác đồ + Trích dẫn (Citations)<br/>- Cảnh báo Tương tác/Chống chỉ định<br/>- Dữ liệu còn thiếu\"]\n    end\n\n    FormattedResponse --> RenderUI[\"Hiển thị trên Tab AI<br/>Bác sĩ 1-click Copy vào Bệnh án\"]\n```\n\n---\n\n## 2. Quản Lý Ngữ Cảnh Lâm Sàng Frontend: Zustand Store & Phân Tích DOM\n\n### 2.1. Phân Tích Nhược Điểm (Cons) Khi Crawl Ngữ Cảnh Từ DOM\n\nHiện tại, component `AiAssistantWidget.tsx` đang thu thập ngữ cảnh màn hình khám bệnh bằng câu lệnh:\n```typescript\nconst mainElement = document.querySelector(\"main\") || document.body;\npageDataSnippet = mainElement.innerText.replace(/\\s+/g, \" \").slice(0, 1500);\n```\n\nDù đây là giải pháp nhanh để dựng MVP, trong môi trường sản phẩm thực tế (Production), cách làm này có **5 nhược điểm chí mạng**:\n\n1. **\"Mù\" hoàn toàn dữ liệu đang nhập trong Form (Input Value Blindness)**:\n   - Các thẻ `<input>`, `<textarea>`, `<select>` lưu trữ dữ liệu người dùng đang nhập dở trong thuộc tính `.value`, **hoàn toàn không phản ánh vào `.innerText`**.\n   - Khi Bác sĩ vừa gõ SpO2 `91%` (suy hô hấp nguy hiểm) hay Thân nhiệt `39.5 °C` nhưng chưa bấm nút \"Lưu\", câu lệnh `innerText` chỉ nhặt được nhãn tĩnh `\"SpO2 (%)\"`, còn giá trị thực tế bị bỏ sót 100%. AI không có dữ liệu mới nhất để đưa ra cảnh báo khẩn cấp.\n2. **Nhiễu giao diện (DOM Noise) & Lãng phí Token**:\n   - `innerText` quét phẳng toàn bộ cây DOM, gom cả các chuỗi text phụ trợ: *\"Về Bảng điều khiển\"*, *\"Ký & Xác nhận\"*, *\"X\"*, *\"Lưu nháp\"*, *\"Trang 1/3\"*.\n   - Gây lãng phí token và làm loãng ngữ cảnh y khoa, tăng nguy cơ mô hình AI bị **ảo giác (hallucination)**.\n3. **Mất cấu trúc phân cấp ngữ nghĩa (Loss of Semantics)**:\n   - Toàn bộ cây dữ liệu bị bẹp thành một chuỗi phẳng, không phân biệt được đâu là tiền sử bệnh cũ vs. triệu chứng cấp tính đợt này.\n4. **Nguy cơ Tấn công Prompt Injection qua Giao diện**:\n   - Dữ liệu ghi chú của bệnh nhân nếu chứa prompt injection vô tình bị cào và gửi trực tiếp vào prompt LLM mà không qua lớp phân lập dữ liệu (data sanitization).\n5. **Tính bất ổn định khi thay đổi Layout**:\n   - Bất kỳ thay đổi CSS/JSX (đổi tab ẩn `display: none`, Modal mở ngoài `<main>`) đều làm đứt gãy luồng cào dữ liệu.\n\n---\n\n### 2.2. Lý Thuyết & So Sánh Giải Pháp: Zustand vs. React Context\n\n| Tiêu chí | React Context | Zustand |\n|---|---|---|\n| **Kích thước gói** | Có sẵn trong React (`0 KB`) | Siêu nhẹ (`~1.2 KB`) |\n| **Hiệu năng Re-render** | **Kém**: Khi 1 chỉ số (vd SpO2) thay đổi, toàn bộ component dùng chung Context đều bị ép re-render | **Tối ưu tuyệt đối**: Hỗ trợ Fine-grained Selectors, chỉ re-render component đăng ký đúng trường đó |\n| **Truy cập ngoài React** | **Không thể**: Bắt buộc phải nằm trong component cây render | **Dễ dàng**: Gọi `useStore.getState()` mọi lúc mọi nơi (trong hàm async, API interceptor, event listener) |\n| **Mở rộng dự án lớn** | Dễ thành Provider Hell (5-10 Providers lồng nhau) | Tổ chức Slice Pattern gọn gàng, tách biệt domain |\n| **Độ phù hợp cho CareFlow AI** | Trung bình (Dễ gây giật lag form nhập liệu lâm sàng) | **Rất cao (Khuyến nghị sử dụng)** |\n\n---\n\n### 2.3. Thiết Kế Store Zustand: `useClinicalWorkspaceStore.ts`\n\nTạo store Zustand chuyên biệt để quản lý toàn bộ dữ liệu lâm sàng động theo thời gian thực:\n\n```typescript\n// frontend/doctor-web/src/stores/useClinicalWorkspaceStore.ts\nimport { create } from 'zustand';\n\nexport interface PatientVitals {\n  heartRate?: string;        // Nhịp tim (bpm)\n  bloodPressure?: string;    // Huyết áp (mmHg), vd: 140/90\n  temperature?: string;      // Thân nhiệt (°C), vd: 38.5\n  spo2?: string;             // Độ bão hòa oxy (%), vd: 94\n  weight?: string;           // Cân nặng (kg)\n  respiratoryRate?: string;  // Nhịp thở (lần/phút)\n}\n\nexport interface PatientDemographics {\n  id: string;\n  fullName: string;\n  gender: string;\n  age: number;\n  allergies: Array<{ name: string; severity: string; reaction?: string }>;\n  medicalHistory: string[];\n}\n\nexport interface ClinicalWorkspaceState {\n  consultationId: string | null;\n  patient: PatientDemographics | null;\n  vitals: PatientVitals;\n  symptoms: string;\n  clinicalNotes: string;\n  diagnose: string;          // Chẩn đoán tạm thời của bác sĩ\n  icd10Code: string;\n  draftPrescriptions: Array<{ drugId: string; drugName: string; dosage: string; frequency: string }>;\n  \n  // Actions\n  setConsultationId: (id: string) => void;\n  setPatient: (patient: PatientDemographics) => void;\n  updateVitals: (vitals: Partial<PatientVitals>) => void;\n  setSymptoms: (symptoms: string) => void;\n  setClinicalNotes: (notes: string) => void;\n  setDiagnose: (diagnose: string, icd10Code?: string) => void;\n  setDraftPrescriptions: (items: ClinicalWorkspaceState['draftPrescriptions']) => void;\n  resetWorkspace: () => void;\n  \n  // Snapshot export for AI\n  getClinicalSnapshot: () => Record<string, unknown>;\n}\n\nexport const useClinicalWorkspaceStore = create<ClinicalWorkspaceState>((set, get) => ({\n  consultationId: null,\n  patient: null,\n  vitals: {},\n  symptoms: '',\n  clinicalNotes: '',\n  diagnose: '',\n  icd10Code: '',\n  draftPrescriptions: [],\n\n  setConsultationId: (id) => set({ consultationId: id }),\n  setPatient: (patient) => set({ patient }),\n  updateVitals: (vitals) => set((state) => ({ vitals: { ...state.vitals, ...vitals } })),\n  setSymptoms: (symptoms) => set({ symptoms }),\n  setClinicalNotes: (clinicalNotes) => set({ clinicalNotes }),\n  setDiagnose: (diagnose, icd10Code) => set({ diagnose, icd10Code: icd10Code ?? '' }),\n  setDraftPrescriptions: (items) => set({ draftPrescriptions: items }),\n  resetWorkspace: () => set({\n    consultationId: null,\n    patient: null,\n    vitals: {},\n    symptoms: '',\n    clinicalNotes: '',\n    diagnose: '',\n    icd10Code: '',\n    draftPrescriptions: []\n  }),\n\n  getClinicalSnapshot: () => {\n    const state = get();\n    return {\n      consultationId: state.consultationId,\n      patient: state.patient ? {\n        id: state.patient.id,\n        fullName: state.patient.fullName,\n        age: state.patient.age,\n        gender: state.patient.gender,\n        allergies: state.patient.allergies,\n        medicalHistory: state.patient.medicalHistory,\n      } : null,\n      vitals: state.vitals,\n      symptoms: state.symptoms,\n      clinicalNotes: state.clinicalNotes,\n      currentDiagnosis: state.diagnose,\n      icd10Code: state.icd10Code,\n      draftPrescriptions: state.draftPrescriptions,\n      extractedAt: new Date().toISOString(),\n    };\n  }\n}));\n```\n\n---\n\n### 2.4. Cơ Chế Chuyển Tab AI & Kỹ Thuật Chống Re-render Tuyệt Đối\n\nTrên trang khám bệnh (`consultation/[id]/page.tsx`):\n1. **Isolated Input Island**: Các ô nhập sinh hiệu (SpO2, nhiệt độ, huyết áp) và ô tìm kiếm thuốc giữ `useState` cục bộ, chỉ sync lên Zustand Store khi blur hoặc debounce 400ms.\n2. **Tab AI Pull-On-Demand**: Khi bác sĩ chuyển tab sang Tab AI (`activeTab === 'ai'`), hệ thống kích hoạt hàm gọi AI và bốc trực tiếp snapshot từ store bằng `getState()`:\n```typescript\n// Trong consultation/[id]/page.tsx\nconst handleSwitchToAiTab = async () => {\n  setActiveTab(\"ai\");\n  \n  // Đọc snapshot tức thì từ Zustand - KHÔNG ĐỌC DOM, KHÔNG GÂY RE-RENDER\n  const snapshot = useClinicalWorkspaceStore.getState().getClinicalSnapshot();\n\n  setAiLoading(true);\n  try {\n    const res = await aiApi.getClinicalSuggestions(consultationId, {\n      question: \"Gợi ý chẩn đoán phân biệt, phác đồ điều trị và cảnh báo tương tác thuốc\",\n      clinicalSnapshot: snapshot // Truyền trực tiếp dữ liệu có cấu trúc\n    });\n    setAiResponse(res.data);\n  } catch (err) {\n    showToast(\"Không thể tải gợi ý AI\", \"danger\");\n  } finally {\n    setAiLoading(false);\n  }\n};\n```\n\n---\n\n## 3. Lý Thuyết Clinical RAG & Giải Pháp Giảm Ảo Giác Y Khoa\n\n### 3.1. Bản Chất RAG Là Gì?\n**RAG (Retrieval-Augmented Generation)** là phương pháp kết hợp sức mạnh suy luận ngôn ngữ tự nhiên của LLM với cơ chế truy xuất thông tin có kiểm chứng từ cơ sở dữ liệu tri thức bên ngoài. Thay vì để LLM tự \"nhớ lại\" kiến thức từ trọng số huấn luyện (parametric memory), RAG cung cấp cho mô hình các đoạn văn bản chính xác nhất (non-parametric external memory) ngay trong prompt đầu vào.\n\n#### Sơ Đồ Nguyên Lý RAG Cơ Bản:\n\n![Sơ đồ Nguyên lý RAG Cơ bản](images/rag-basic-architecture.png)\n\n*Hình 3.1: Sơ đồ luồng xử lý RAG cơ bản từ Người dùng (User) qua Bộ truy xuất (Retriever), Nguồn dữ liệu (Data Source) đến Mô hình ngôn ngữ lớn (LLM).*\n\n#### Đối Chiếu Sơ Đồ Với Quy Trình Lâm Sàng Tại CareFlow:\n\n| Thành phần trên Sơ đồ | Vai trò tương ứng trong Hệ thống CareFlow | Luồng dữ liệu thực tế |\n|---|---|---|\n| **1. User (Người dùng)** | **Bác sĩ khám bệnh** tại phòng khám ngoại trú | Khi Bác sĩ chuyển sang Tab \"🤖 Trợ lý AI\", hệ thống tự động bốc dữ liệu từ Zustand Store (SpO2, nhiệt độ, huyết áp, triệu chứng, chẩn đoán tạm thời) tạo thành **Query**. |\n| **2. Retriever (Bộ truy xuất)** | **Clinical RAG Retrieval Engine** (`careflow-ai-service`) | Tiếp nhận Query lâm sàng, sinh vector embedding và thực hiện **Hybrid Search (Dense Cosine + Sparse BM25)**. |\n| **3. Data Source (Nguồn dữ liệu)** | **PostgreSQL + `pgvector` & Tri thức Y tế Chuẩn** | Kho dữ liệu tĩnh gồm: Phác đồ Chẩn đoán & Điều trị của Bộ Y Tế, Dược thư Quốc gia Việt Nam, Bảng tương tác thuốc, Từ điển ICD-10. |\n| **4. Relevant Text** | **Trích đoạn Phác đồ Khớp nhất** (Top 3-5 Chunks) | Dữ liệu điều trị chính xác (liều lượng, chống chỉ định, tiêu chuẩn chẩn đoán) được Retriever trích xuất từ Data Source. |\n| **5. Query + Text ➔ LLM** | **Grounded Clinical Prompt** | Prompt kết hợp: Ngữ cảnh bệnh nhân thực tế + Trích đoạn phác đồ BYT + System Prompt Guardrails chuyển sang LLM. |\n| **6. LLM ➔ Response** | **Google Gemini 2.5 Flash / DeepSeek V3** | Mô hình tổng hợp và sinh ra **Response** có cấu trúc JSON: Gợi ý chẩn đoán phân biệt, phác đồ điều trị, cảnh báo tương tác thuốc kèm trích dẫn văn bản (Citations). |\n| **7. Response ➔ User** | **Giao diện Tab AI trên `doctor-web`** | Bác sĩ xem phân tích, kiểm tra trích dẫn và 1-click sao chép vào bệnh án hoặc đơn thuốc chính thức. |\n\n### 3.2. Ba Vấn Đề Lớn Của LLM Trong Y Tế & Cách RAG Giải Quyết Cho CareFlow\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#FFFFFF', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B', 'clusterBkg': '#F8FAFC', 'clusterBorder': '#CBD5E1', 'titleColor': '#0F172A' }}}%%\ngraph LR\n    subgraph Vấn_Đề_LLM[\"Vấn đề của LLM Thuần túy\"]\n        H1[\"1. Ảo giác Y khoa (Hallucinations)<br/>Tự bịa liều lượng & hoạt chất\"]\n        H2[\"2. Thiếu Phác đồ Bộ Y Tế (MOH)<br/>Chỉ biết tài liệu y văn nước ngoài\"]\n        H3[\"3. Phản hồi Chung chung<br/>Không khớp với SpO2, Sốt cụ thể\"]\n    end\n\n    subgraph RAG_Solution[\"Giải Pháp Từ Clinical RAG\"]\n        S1[\"Grounding & Citation Trích dẫn<br/>Bắt buộc đính kèm văn bản gốc\"]\n        S2[\"CSDL Phác đồ BYT & Dược thư QG<br/>Tra cứu chính xác Quyết định BYT\"]\n        S3[\"In-Context Fusion<br/>Kết hợp Snapshot Zustand + Phác đồ\"]\n    end\n\n    H1 --> S1\n    H2 --> S2\n    H3 --> S3\n```\n\n1. **Ngăn chặn Ảo giác Y khoa (Zero Hallucination Tolerance)**:\n   - Trong thương mại điện tử, AI bịa một tính năng có thể chỉ gây khó chịu; nhưng trong y tế, AI bịa liều dùng hoặc bỏ qua tương tác thuốc có thể gây tử vong.\n   - Clinical RAG ép buộc mô hình tuân thủ nguyên tắc: *\"Chỉ đưa ra kết luận dựa trên các trích đoạn tài liệu y khoa được cung cấp. Nếu không tìm thấy trong tài liệu, phải báo rõ là thông tin chưa có trong phác đồ.\"*\n2. **Tuân thủ Tuyệt đối Phác đồ Bộ Y Tế & Danh mục Thuốc Việt Nam**:\n   - Các mô hình như GPT-4 hay Claude được huấn luyện trên y văn quốc tế (FDA, NICE, WHO), thường gợi ý các loại thuốc đắt tiền chưa được cấp phép tại Việt Nam hoặc không phù hợp với phân tuyến phòng khám ngoại trú.\n   - Bằng cách nạp trực tiếp **Dược thư Quốc gia Việt Nam** và **Các Quyết định Hướng dẫn Điều trị của Bộ Y Tế** vào Vector DB, câu trả lời của AI luôn chuẩn hóa theo quy chuẩn y tế Việt Nam.\n3. **Cá nhân hóa Phân tích Dựa trên Sinh hiệu Tức thời (Dynamic Metrics Grounding)**:\n   - RAG không chỉ truy xuất tài liệu tĩnh, mà còn đưa các chỉ số sinh hiệu thực tế (SpO2, nhiệt độ, huyết áp) từ Zustand Store vào ngữ cảnh để đối chiếu trực tiếp với tiêu chuẩn chẩn đoán trong phác đồ (Ví dụ: Phác đồ Viêm phổi quy định SpO2 < 92% là dấu hiệu nặng cần nhập viện).\n\n### 3.3. Thách Thức Khi Triển Khai RAG Trong CareFlow & Hướng Giải Pháp Đề Xuất\n\nMặc dù RAG là chiếc cầu nối lý tưởng giữa mô hình ngôn ngữ lớn (LLM) và kho tri thức y tế chuẩn, việc áp dụng vào môi trường thực tế tại CareFlow đối mặt với **3 thách thức đặc thù** (dựa trên phân tích từ thực tiễn triển khai RAG):\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#FFFFFF', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B', 'clusterBkg': '#F8FAFC', 'clusterBorder': '#CBD5E1', 'titleColor': '#0F172A' }}}%%\ngraph TD\n    subgraph Challenges[\"3 Thách Thức Khi Áp Dụng RAG Vào CareFlow\"]\n        C1[\"1. Độ Phức Tạp Tích Hợp Đa Nguồn<br/>(PDF scan BYT, Dược thư, ICD-10, Zustand JSON)\"]\n        C2[\"2. Khả Năng Mở Rộng & Áp Lực Thời Gian Thực<br/>(Bác sĩ chỉ có 2-3 phút/ca, không thể chờ 10s)\"]\n        C3[\"3. Kiểm Soát Chất Lượng Dữ Liệu Y Tế<br/>(Phác đồ hết hạn, sai liều dùng là thảm họa)\"]\n    end\n\n    subgraph Solutions[\"Hướng Giải Pháp Đề Xuất Cho CareFlow\"]\n        S1[\"Thiết kế Ingestion Adapters Riêng Biệt<br/>Dùng 1 Embedding Model BGE-M3 Thống Nhất\"]\n        S2[\"Pre-filtering bằng Metadata JSONB + HNSW Index<br/>Caching Cặp Thuốc & Triệu Chứng Phổ Biến\"]\n        S3[\"Quy Trình Kiểm Duyệt Human-in-the-loop<br/>Chỉ Nạp Văn Bản Có Số Quyết Định Còn Hiệu Lực\"]\n    end\n\n    C1 --> S1\n    C2 --> S2\n    C3 --> S3\n```\n\n#### 1. Thách thức về Độ phức tạp tích hợp (Integration Complexity)\n* **Vấn đề cụ thể tại CareFlow**:\n  - Tri thức y tế không nằm ở một nơi đồng nhất mà phân tán dưới nhiều định dạng:\n    * Hướng dẫn điều trị của Bộ Y Tế tồn tại dưới dạng file PDF scan hành chính (chứa nhiều bảng phân độ nặng, lưu đồ phân tuyến điều trị phức tạp).\n    * Dược thư Quốc gia là sách chuyên luận với mật độ thông tin dày đặc.\n    * Danh mục mã bệnh ICD-10 và Danh mục Thuốc phòng khám là file bảng tính Excel/CSV.\n    * Ngữ cảnh ca khám hiện tại là đối tượng JSON động từ Zustand Store (`useClinicalWorkspaceStore`).\n  - Nếu đưa toàn bộ các nguồn này vào một bộ xử lý chung, dữ liệu sẽ bị vỡ cấu trúc và làm sai lệch không gian biểu diễn vector (Vector Embeddings).\n* **Hướng giải pháp đề xuất cho CareFlow**:\n  - **Thiết kế các Ingestion Adapter riêng biệt**:\n    * `MOHGuidelineAdapter`: Chuyên trách đọc PDF phác đồ, trích xuất cấu trúc đề mục và bảo toàn nguyên vẹn các bảng phân độ.\n    * `DrugInteractionAdapter`: Chuyên trách chuẩn hóa các cặp tương tác thuốc (DDI) thành các bản ghi dạng Entity Pairs có cấu trúc.\n    * `ICD10LookupAdapter`: Chuẩn hóa danh mục mã bệnh theo bảng phân loại quốc tế.\n  - **Mô hình Embedding Đồng nhất**: Toàn bộ các nguồn tài liệu tĩnh và câu hỏi truy vấn của Bác sĩ đều sử dụng chung một mô hình embedding chuẩn (`BAAI/bge-m3` hoặc Google `text-embedding-004`) để đảm bảo không gian vector luôn nhất quán 100%.\n\n#### 2. Thách thức về Khả năng mở rộng & Thời gian phản hồi thực tế (Scalability & Real-time Latency)\n* **Vấn đề cụ thể tại CareFlow**:\n  - Khi kho dữ liệu phác đồ mở rộng qua nhiều chuyên khoa (Tim mạch, Hô hấp, Tiêu hóa, Thần kinh...), số lượng text chunks có thể lên tới hàng chục nghìn đoạn. Việc quét tìm kiếm ngữ nghĩa toàn bộ CSDL cho mỗi câu hỏi sẽ gây nghẽn tài nguyên CPU/RAM.\n  - Quan trọng hơn, **Bác sĩ tại phòng khám ngoại trú chỉ có trung bình 2 đến 3 phút cho mỗi ca khám**. Nếu tính năng AI phản hồi trễ quá 5-10 giây, Bác sĩ sẽ không thể sử dụng trong ca trực.\n* **Hướng giải pháp đề xuất cho CareFlow**:\n  - **Lọc trước theo chuyên khoa (Metadata Pre-filtering)**: Mỗi đoạn trích trong `pgvector` đều được gắn thẻ chuyên khoa (`specialty`). Khi Bác sĩ đang ở phòng khám Hô hấp, câu truy vấn SQL chỉ quét trong các chunk Hô hấp, thu hẹp phạm vi từ 10.000 chunks xuống chỉ còn ~200 chunks.\n  - **Tối ưu Chỉ mục HNSW (Hierarchical Navigable Small World)**: Sử dụng chỉ mục HNSW trên PostgreSQL `pgvector` giúp thời gian tìm kiếm vector tương đồng (ANN) giảm xuống **dưới 20ms**.\n  - **Bộ nhớ đệm thông minh (In-Memory Caching)**: Áp dụng cơ chế cache (Caffeine Cache / Spring Cache) cho các cặp tương tác thuốc phổ biến và các câu hỏi phác đồ tiêu chuẩn để trả về kết quả gần như tức thì (< 50ms).\n\n#### 3. Thách thức về Kiểm soát Chất lượng Dữ liệu (Data Quality & Clinical Oversight)\n* **Vấn đề cụ thể tại CareFlow**:\n  - Hiệu quả của RAG phụ thuộc trực tiếp vào chất lượng tài liệu nạp vào. Nếu đưa vào tài liệu không rõ nguồn gốc, văn bản phác đồ cũ đã bị Bộ Y Tế bãi bỏ, hoặc bảng liều lượng bị lỗi định dạng thì AI sẽ tạo ra gợi ý sai lệch, đe dọa an toàn người bệnh.\n* **Hướng giải pháp đề xuất cho CareFlow**:\n  - **Quy trình Kiểm duyệt có Con người tham gia (Human-in-the-loop)**: Toàn bộ dữ liệu trước khi chạy script nạp vào `pgvector` phải được rà soát và đối chiếu với văn bản có chữ ký, số Quyết định ban hành chính thức từ cổng thông tin Cục Quản lý Khám chữa bệnh (`kcb.vn`).\n  - **Quản lý Vòng đời & Hạn sử dụng Phác đồ (Version Control & Expiry Tracking)**: Bảng `clinical_guideline_documents` lưu trữ rõ `published_year` và trạng thái `is_active`. Khi Bộ Y Tế ban hành Quyết định mới thay thế, hệ thống chỉ cần cập nhật trạng thái của phác đồ cũ mà không làm gián đoạn CSDL.\n  - **Kỹ thuật Chặn Suy Đoán (Strict Fallback Guardrail)**: Nếu qua bước Retriever mà độ tương đồng ngữ nghĩa (Cosine score) thấp hơn ngưỡng an toàn, mô hình LLM được lập trình để trả lời thẳng thắn: *\"Chưa tìm thấy phác đồ phù hợp trong cơ sở dữ liệu hiện tại, Bác sĩ vui lòng tra cứu tài liệu chuyên khoa.\"*, tuyệt đối không để AI tự ý suy đoán bừa.\n\n---\n\n## 4. Nhu Cầu Dữ Liệu, Mô Hình & Chiến Lược Huấn Luyện (Data, Models & Training Strategy)\n\n\n\n<div class=\"callout callout-note\"><strong>ℹ️ LƯU Ý:</strong><br/>**LƯU Ý CỐT LÕI VỀ DỮ LIỆU Y TẾ:**  \n*\"Trong một hệ thống Clinical RAG (RAG Y tế / Hỗ trợ Quyết định Lâm sàng) như CareFlow, dữ liệu không thể thu thập một cách tùy tiện hay cào bừa bãi trên mạng. Sai số trong thương mại điện tử chỉ làm khách hàng mua nhầm món đồ, nhưng sai số trong y tế có thể trả giá bằng tính mạng người bệnh.\"*\n</div>\n\n\n### 4.1. Phân Loại Dữ Liệu Cần Chuẩn Bị Cho CareFlow RAG\n\n```mermaid\nclassDiagram\n    class StaticMedicalKnowledge {\n        +Phác đồ Điều trị Bộ Y Tế (PDF/Markdown)\n        +Dược thư Quốc gia Việt Nam (Bảng tương tác thuốc)\n        +Danh mục Bệnh tật Quốc tế ICD-10 (BYT)\n        +Danh mục Thuốc & Hoạt chất Phòng khám\n    }\n    class DynamicPatientContext {\n        +Sinh hiệu thời gian thực (SpO2, Nhiệt độ, Mạch, HA)\n        +Tiền sử dị ứng & Bệnh nền\n        +Triệu chứng lâm sàng do Bác sĩ nhập\n        +Chẩn đoán sơ bộ & Đơn thuốc dự thảo\n    }\n    class ClinicalRAGPipeline {\n        +Ingest & Chunking\n        +Hybrid Retrieval\n        +Re-ranking\n        +Grounded LLM Prompting\n    }\n    StaticMedicalKnowledge --> ClinicalRAGPipeline: Offline Ingestion\n    DynamicPatientContext --> ClinicalRAGPipeline: Realtime Zustand Snapshot\n```\n\n#### A. Dữ Liệu Tri Thức Y Khoa Tĩnh (Static Medical Knowledge — Nạp vào Vector DB):\n1. **Hướng dẫn Chẩn đoán & Điều trị của Bộ Y Tế Việt Nam**:\n   - Các Quyết định chính thức do Bộ Y Tế ban hành (Cục Quản lý Khám chữa bệnh — `kcb.vn`).\n   - Tiêu chuẩn chẩn đoán, phân độ nặng nhẹ gắn liền với ngưỡng sinh hiệu (ví dụ: *Viêm phổi nặng khi SpO2 < 92%, nhịp thở > 30 lần/phút*), phác đồ kháng sinh đầu tay (first-line) và phân tuyến kỹ thuật bệnh viện.\n   - Các quyết định ưu tiên nạp trước: Quyết định 4800/QĐ-BYT (Bệnh lý Hô hấp), Quyết định 5968/QĐ-BYT (Tim mạch & Tăng huyết áp), Quyết định 5481/QĐ-BYT (Đái tháo đường týp 2), Sốt xuất huyết Dengue, Nhi khoa.\n2. **Dược thư Quốc gia Việt Nam (Bản mới nhất)**: \n   - Dữ liệu về hơn 600 chuyên luận thuốc chính thống: Chỉ định, Chống chỉ định tuyệt đối/tương đối, Liều lượng theo độ tuổi/cân nặng và chức năng thận (CrCl/eGFR), Cảnh báo dị ứng chéo (ví dụ: *Dị ứng Penicillin có nguy cơ dị ứng chéo 5-10% với Cephalosporin thế hệ 1*).\n3. **Cơ Sở Dữ Liệu Cặp Tương Tác Thuốc (Drug-Drug Interactions - DDI)**:\n   - Dữ liệu dạng Bảng/Cặp thực thể (Entity Pairs) có cấu trúc: Cặp hoạt chất A + B ➔ Mức độ nguy cơ (CHỐNG CHỈ ĐỊNH / NGHIÊM TRỌNG / CẦN THEO DÕI) ➔ Cơ chế dược lý (ví dụ: *Clopidogrel + Omeprazole làm giảm hoạt tính chống đông máu*) ➔ Hành động khuyến cáo cho Bác sĩ.\n4. **Từ điển Danh mục ICD-10 Tiếng Việt Chuẩn Bộ Y Tế**:\n   - Toàn bộ bảng mã ICD-10 chuẩn được Bộ Y Tế ban hành dùng cho chuẩn hóa chẩn đoán hồ sơ bệnh án.\n5. **Danh mục Thuốc & Hoạt chất Phòng khám (Clinic Drug Formulary)**:\n   - Bảng thuốc từ microservice `careflow-prescription-service` (`drugs_dictionary`): Tên thương mại, hoạt chất, nồng độ/hàm lượng, dạng bào chế, đường dùng.\n6. **Tiêu Chuẩn Vàng Đánh Giá Dữ Liệu Y Tế (Data Quality Benchmark)**:\n   - **Tính Pháp Lý**: 100% văn bản có số hiệu Quyết định, ngày ký và còn hiệu lực thi hành.\n   - **Không chứa PII**: Tuyệt đối không chứa số CCCD, SĐT, tên thật, địa chỉ của bệnh nhân.\n   - **Toàn vẹn Bảng biểu (Table Integrity)**: Bảng liều lượng và bảng tương tác thuốc bắt buộc chuyển đổi sang Markdown Table hoặc JSON, tuyệt đối không làm phẳng thành text thô để tránh đảo lộn liều dùng.\n\n#### B. Dữ Liệu Lâm Sàng Động (Dynamic Patient Context — Real-time Snapshot từ Zustand):\n- Được cung cấp tự động từ Zustand Store của Frontend khi Bác sĩ bấm chuyển Tab AI hoặc bấm nút yêu cầu gợi ý:\n  - Sinh hiệu tức thời: SpO2, Thân nhiệt, Huyết áp, Nhịp tim, Cân nặng.\n  - Tiền sử dị ứng & Bệnh nền mạn tính.\n  - Triệu chứng lâm sàng do Bác sĩ đang nhập dở.\n  - Chẩn đoán sơ bộ (`diagnose`) & Danh sách đơn thuốc dự thảo (`draftPrescriptions`).\n\n---\n\n### 4.2. Chiến Lược Thu Thập & Chuẩn Hóa Dữ Liệu Để Vector Hóa (Data Ingestion & Embedding Pipeline)\n\nĐể đưa dữ liệu vào PostgreSQL `pgvector` sao cho mô hình tìm kiếm ngữ nghĩa (Vector Search) và tìm kiếm từ khóa (Full-Text Search) hoạt động chuẩn xác nhất, dữ liệu có cấu trúc (Structured) và phi cấu trúc (Unstructured) cần được thu thập và xử lý theo quy trình sau:\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#FFFFFF', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B', 'clusterBkg': '#F8FAFC', 'clusterBorder': '#CBD5E1', 'titleColor': '#0F172A' }}}%%\nflowchart TD\n    subgraph RawSources[\"Nguồn Thu Thập Ban Đầu\"]\n        R1[\"PDF Phác đồ BYT<br/>(QĐ 4800, 5968, 5481...)\"]\n        R2[\"Bảng DDI Tương tác thuốc<br/>(CSV / Excel / Dược thư)\"]\n        R3[\"Danh mục Thuốc & ICD-10<br/>(PostgreSQL Table / JSON)\"]\n    end\n\n    subgraph Preprocessing[\"Tiền Xử Lý & Chuẩn Hóa (Cực Kỳ Quan Trọng)\"]\n        P1[\"PDF OCR & Clean Markdown<br/>(Loại bỏ header/footer, giữ nguyên đề mục #, ##)\"]\n        P2[\"Synthetic Narrative Generation<br/>(Biến bảng DDI thành câu văn hoàn chỉnh)\"]\n        P3[\"Structured Metadata Extraction<br/>(Gắn tags: specialty, icd10, severity, doc_code)\"]\n    end\n\n    subgraph ChunkingEmbedding[\"Cắt Đoạn & Vector Hóa\"]\n        C1[\"Hierarchical Chunking (400-800 tokens)<br/>+ Gắn Context Breadcrumbs vào đầu chunk\"]\n        C2[\"BGE-M3 / text-embedding-004<br/>(Sinh Dense Vector 1024d / 768d)\"]\n        C3[\"to_tsvector('simple')<br/>(Sinh Sparse Lexical Tokens)\"]\n    end\n\n    subgraph Storage[\"Lưu Trữ Trong PostgreSQL pgvector\"]\n        DB[(\"Bảng clinical_guideline_chunks<br/>- content TEXT<br/>- embedding VECTOR<br/>- tsv_content TSVECTOR<br/>- metadata JSONB\")]\n    end\n\n    R1 --> P1 --> C1\n    R2 --> P2 --> C1\n    R3 --> P3 --> C1\n    C1 --> C2 --> DB\n    C1 --> C3 --> DB\n    P3 -.-> DB\n```\n\n#### 1. Quy Cách Xử Lý Dữ Liệu Phi Cấu Trúc (Unstructured: PDF Phác Đồ Bộ Y Tế & Chuyên Luận Dược Thư)\n* **Vấn đề của PDF gốc**: Các file PDF hành chính của Bộ Y Tế thường chia 2 cột, ngắt dòng tùy tiện, bảng bị vỡ khung và header/footer (Số trang, \"Bộ Y Tế\", \"Quyết định...\") lặp lại liên tục làm rác vector.\n* **Cách thu thập & chuẩn hóa lý tưởng**:\n  1. **Chuyển đổi sang Markdown sạch (`.md`)**: Dùng tool OCR chuyên dụng (như `Marker`, `Nougat` hoặc dùng trực tiếp LLM như Gemini Flash đọc PDF) để parse về Markdown chuẩn.\n  2. **Bảo toàn phân cấp đề mục (Hierarchy Preservation)**:\n     - `# Tên bệnh lý` (ví dụ: `# Viêm phổi mắc phải cộng đồng ở người lớn`)\n     - `## 1. Định nghĩa & Nguyên nhân`\n     - `## 2. Tiêu chuẩn chẩn đoán & Phân tầng nguy cơ`\n     - `## 3. Phác đồ điều trị ngoại trú (Kháng sinh đầu tay, liều lượng, thời gian dùng)`\n     - `## 4. Dấu hiệu cảnh báo chuyển viện`\n  3. **Kỹ thuật Breadcrumbs Context (Gắn ngữ cảnh vào đầu mỗi chunk)**:\n     - Khi cắt văn bản thành các đoạn 400 - 800 tokens, một đoạn trích liều thuốc đứng trơ trọi sẽ khiến AI không biết liều đó là cho Viêm phổi hay Viêm phế quản.\n     - **Giải pháp**: Luôn nối chuỗi tiêu đề cha vào đầu mỗi chunk trước khi embed:\n       > `[Ngữ cảnh: BYT-QĐ-4800 > Bệnh Hô Hấp > Viêm phổi mắc phải cộng đồng > Điều trị Ngoại trú]: Đối với bệnh nhân không có bệnh lý đồng mắc, kháng sinh đầu tay là Amoxicillin 1g x 3 lần/ngày uống...`\n\n#### 2. Quy Cách Xử Lý Dữ Liệu Có Cấu Trúc (Structured: Bảng DDI Tương Tác Thuốc, Danh Mục Thuốc & ICD-10)\n* **Vấn đề nếu nhúng thô (Raw embedding)**: Nếu quăng nguyên 1 dòng CSV `Clopidogrel, Omeprazole, Severe, CYP2C19` vào embedding model, vector sẽ rất nghèo nàn về ngữ nghĩa và không thể match với câu hỏi tự nhiên của bác sĩ như *\"bệnh nhân tim mạch dùng Clopidogrel có được kê kèm thuốc dạ dày không\"*.\n* **Cách thu thập & chuẩn hóa lý tưởng**:\n  1. **Kỹ thuật Chuyển Bảng thành Câu Văn Tự Nhiên (Synthetic Narrative / Textualization)**:\n     - Biến mỗi dòng trong bảng tương tác thuốc thành một đoạn văn súc tích có cấu trúc ngữ nghĩa:\n     > *\"Tương tác thuốc giữa [Clopidogrel] và [Omeprazole]: Mức độ cảnh báo [NGHIÊM TRỌNG]. Cơ chế dược lý: Omeprazole ức chế mạnh isoenzyme CYP2C19 ở gan, làm giảm nồng độ chuyển hóa có hoạt tính của Clopidogrel trong huyết tương, dẫn đến giảm đáng kể hiệu quả ức chế kết tập tiểu cầu và làm tăng nguy cơ biến cố huyết khối tim mạch. Hành động khuyến cáo: Tránh phối hợp. Nếu bắt buộc cần thuốc ức chế bơm proton (PPI) để bảo vệ dạ dày, xem xét thay thế bằng Pantoprazole.\"*\n  2. **Dữ liệu Danh mục thuốc (`drugs_dictionary`) & ICD-10**:\n     - Lưu trữ trực tiếp trong CSDL quan hệ dưới dạng bảng chuẩn hóa.\n     - **Không cần vector hóa toàn bộ danh mục ICD-10 hay danh mục thuốc**: Với mã ICD-10 và tên thuốc, tìm kiếm chính xác (Exact match) và Full-Text Search (Trigram / ILIKE / tsvector) trên PostgreSQL nhanh hơn và chính xác 100% so với tìm kiếm vector tương đối!\n\n#### 3. Gắn Siêu Dữ Liệu Phong Phú (Rich Metadata JSONB) Cho Phép SQL Pre-Filtering\nKhi nạp mỗi chunk vào `clinical_guideline_chunks`, gắn kèm `metadata JSONB` để hỗ trợ lọc trước:\n```json\n{\n  \"source_document\": \"BYT-QD-4800-HOHAP\",\n  \"specialty\": \"Hô hấp\",\n  \"disease_name\": \"Viêm phổi mắc phải cộng đồng\",\n  \"icd10_codes\": [\"J13\", \"J15\", \"J18\"],\n  \"target_population\": \"adult\",\n  \"care_setting\": \"outpatient\",\n  \"drugs_mentioned\": [\"Amoxicillin\", \"Clavulanic acid\", \"Clarithromycin\", \"Azithromycin\"],\n  \"section_type\": \"treatment_protocol\"\n}\n```\n* **Lợi ích**: Khi Bác sĩ đang khám chuyên khoa **Hô hấp**, câu truy vấn SQL chỉ quét các chunk có `\"specialty\": \"Hô hấp\"` và `\"care_setting\": \"outpatient\"`. Thay vì quét 20.000 chunks, hệ thống chỉ quét ~150 chunks, giúp tốc độ phản hồi đạt **< 15ms**!\n\n---\n\n### 4.3. Chiến Lược: Tại Sao RAG Vượt Trội So Với Fine-Tuning Trong Y Tế?\n\nMột câu hỏi thường gặp khi bắt đầu: **\"Liệu chúng ta có nên Fine-tune một LLM bằng toàn bộ sách y khoa không?\"**\n\nDựa trên các nghiên cứu y tế lâm sàng quốc tế (*Nature Medicine, NEJM AI, Stanford MedRAG*), câu trả lời rõ ràng là: **KHÔNG NÊN fine-tune LLM nền để lưu trữ kiến thức y khoa**.\n\n| Tiêu chí | Fine-Tuning LLM (Tinh chỉnh mô hình) | Clinical RAG (Khuyến nghị cho CareFlow) |\n|---|---|---|\n| **Cơ chế lưu trữ tri thức** | Lưu trong trọng số nơ-ron (Parametric Memory) | Lưu trong Vector DB có thể truy vấn (Non-parametric Memory) |\n| **Yêu cầu Huấn luyện lại (Retraining)** | **BẮT BUỘC HUẤN LUYỆN LẠI**: Cần chạy lại training loop mỗi khi có dữ liệu mới | **HOÀN TOÀN KHÔNG CẦN HUẤN LUYỆN**: Chỉ cần nạp tài liệu mới vào DB là cập nhật tức thì |\n| **Nguy cơ Ảo giác (Hallucination)** | **Rất cao**: Mô hình vẫn tự tin bịa thông tin sai lệch khi bị quá tải tham số | **Rất thấp**: Kết quả bị chặn và kiểm soát chặt bởi tài liệu thực tế |\n| **Khả năng Cập nhật Phác đồ mới** | **Tốn kém & Chậm**: Khi Bộ Y Tế ra phác đồ mới, phải gom dữ liệu và huấn luyện lại toàn bộ mô hình | **Tức thì (Zero-downtime)**: Nạp file PDF/Markdown mới vào DB trong vài giây, áp dụng ngay |\n| **Khả năng Kiểm chứng (Traceability)** | **Không thể**: Không thể biết tại sao mô hình sinh ra liều thuốc đó | **Rõ ràng 100%**: Trích dẫn chính xác trang sách, số Quyết định của Bộ Y Tế |\n| **Chi phí Tính toán & Phần cứng** | Cần cụm GPU cao cấp (A100/H100) trị giá hàng chục nghìn USD | Chạy trên hạ tầng PostgreSQL hiện có, chi phí cực thấp, phù hợp nhóm làm đồ án |\n\n#### Bản Chất \"Không Cần Huấn Luyện Lại\" (Zero Retraining) — Lợi Thế Quyết Định Của RAG:\n\nMột trong những ưu điểm vượt trội nhất của RAG so với Fine-tuning là khả năng **cung cấp cập nhật động mà không cần huấn luyện lại mô hình (Zero Model Retraining)**:\n\n1. **Sự Bất Cập Khi Dùng Fine-tuning Trong Y Tế**:\n   - Y khoa là ngành liên tục cập nhật: Bộ Y Tế thường xuyên ban hành các Quyết định mới thay thế phác đồ cũ, rút số đăng ký của thuốc có nguy cơ tác dụng phụ, hoặc cập nhật hướng dẫn điều trị khẩn cấp khi bùng phát dịch bệnh (sốt xuất huyết, cúm mới...).\n   - Nếu áp dụng Fine-tuning: Mỗi lần Bộ Y Tế ra phác đồ mới, nhóm phát triển sẽ phải chuẩn bị lại bộ dữ liệu huấn luyện, thuê máy chủ GPU mạnh, tinh chỉnh lại hàng tỷ tham số mô hình trong nhiều ngày, và đối mặt với nguy cơ **Quên thảm họa (Catastrophic Forgetting)** làm suy giảm các khả năng suy luận logic khác của LLM.\n2. **Cơ Chế Thích Ứng Tức Thì Của RAG (Dynamic Adaptation)**:\n   - RAG **tách rời hoàn toàn** giữa **Năng lực Suy luận (LLM Reasoning Engine)** và **Cơ sở Tri thức (External Knowledge Base)**. LLM (như Gemini 2.5 Flash hay DeepSeek) chỉ đóng vai trò như một \"Bác sĩ biết đọc và phân tích\", còn phác đồ Bộ Y Tế trong `pgvector` là \"cuốn sách hướng dẫn mở sẵn trước mặt\".\n   - Khi có Quyết định mới của Bộ Y Tế: Chúng ta chỉ cần chạy script nạp tài liệu mới vào PostgreSQL trong **vài giây**. Ngay ở lượt khám tiếp theo, khi Bác sĩ bấm Tab AI, bộ Retriever sẽ tự động bốc đoạn phác đồ mới nhất đưa vào prompt để LLM đọc và gợi ý.\n   - **Lợi ích thực tế cho nhóm sinh viên**: Nhóm hoàn toàn giải phóng khỏi gánh nặng chi phí phần cứng huấn luyện GPU đắt đỏ, không tốn thời gian train model, mà vẫn sở hữu một hệ thống AI luôn luôn cập nhật và tuân thủ chuẩn xác 100% quy định y tế mới nhất.\n\n\n\n<div class=\"callout callout-important\"><strong>⚠️ QUAN TRỌNG:</strong><br/>**Khi nào mới cần Fine-Tuning?**\nChúng ta **KHÔNG fine-tune LLM**, nhưng trong tương lai có thể xem xét **Fine-tune nhẹ Embedding Model (BGE-M3)** hoặc **Cross-Encoder Reranker** trên tập dữ liệu cặp câu y khoa tiếng Việt (Vietnamese Medical Triples: Query - Positive Guideline - Negative Guideline) để giúp mô hình hiểu sâu các từ viết tắt chuyên ngành của bác sĩ Việt Nam (vd: *THA* = Tăng huyết áp, *ĐTĐ* = Đái tháo đường, *VP màng phổi*, *HCCT*...).\n</div>\n\n\n---\n\n### 4.4. Lựa Chọn Mô Hình (Model Selection) Chuẩn Xác\n\n1. **Mô hình Embedding (Dense Vector Representation)**:\n   - **Lựa chọn 1 (Khuyên dùng cho Self-hosted/Hạ tầng mở)**: `BAAI/bge-m3`\n     - Là mô hình đa ngôn ngữ hàng đầu thế giới hiện nay, hỗ trợ tiếng Việt cực kỳ xuất sắc.\n     - Hỗ trợ đa cơ chế: Dense Retrieval (1024 chiều), Sparse Retrieval (tương đương BM25) và Multi-vector (ColBERT).\n   - **Lựa chọn 2 (Cloud Managed)**: `text-embedding-004` (Google AI Studio)\n     - Độ dài vector 768 chiều, chi phí rẻ, tích hợp sẵn qua API Key Gemini của dự án.\n2. **Mô hình Re-ranking (Cross-Encoder Re-ranker)**:\n   - `BAAI/bge-reranker-v2-m3` hoặc `Cohere Rerank v3`.\n   - Giúp đánh giá chiều sâu ngữ nghĩa giữa câu hỏi lâm sàng của Bác sĩ và Top 20 đoạn trích phác đồ, lọc ra Top 3-5 đoạn trích chuẩn xác nhất.\n3. **Mô hình LLM Sinh Lời Khuyên (Clinical Generator)**:\n   - **Primary**: `Gemini 2.5 Flash` (Google) — Context window 1M token, tốc độ phản hồi cực nhanh (1-2s), chi phí tối ưu, khả năng đọc JSON mode và suy luận lâm sàng vững vàng.\n   - **Fallback & Deep Reasoning**: `DeepSeek-V3` / `DeepSeek-R1` — Phục vụ các ca bệnh phức tạp có nhiều bệnh lý nền chồng chéo.\n\n---\n\n### 4.5. Định Hướng Tự Tải Model Về Huấn Luyện (Fine-Tuning Open-Source SLM) Ở Các Phase Sau\n\nMặc dù ở giai đoạn đầu (P0 MVP), nhóm tận dụng API có sẵn (Gemini/DeepSeek) để hoàn thiện luồng nghiệp vụ nhanh nhất, ở các phase tiếp theo (Phase 3), việc **tự tải một mô hình mã nguồn mở về máy chủ cục bộ và huấn luyện tinh chỉnh (Fine-tuning)** là bước đi chiến lược để làm chủ công nghệ và tối ưu hóa sâu cho y tế Việt Nam.\n\n#### 1. Lựa Chọn Mô Hình Mã Nguồn Mở Nền Tảng (Base SLM/LLM)\nKhông cần tải các mô hình khổng lồ 70B tham số (đòi hỏi hạ tầng máy chủ hàng trăm triệu đồng), nhóm nhắm tới các **Mô hình Ngôn ngữ Nhỏ (SLM - Small Language Models)** từ 7B đến 8B tham số:\n* **`Qwen2.5-7B-Instruct`**: Hiện là mô hình mã nguồn mở 7B mạnh nhất thế giới về khả năng suy luận logic, hiểu tiếng Việt cực tốt và xuất định dạng JSON Schema chuẩn xác 100%.\n* **`Llama-3.1-8B-Instruct`**: Khả năng đọc ngữ cảnh dài (Context 128K), hệ sinh thái công cụ hỗ trợ phong phú.\n* **`Vistral-7B-Chat` / `PhoGPT-7B5`**: Các mô hình mã nguồn mở tối ưu hóa chuyên sâu cho ngữ pháp và ngôn ngữ tiếng Việt.\n\n#### 2. Kỹ Thuật Huấn Luyện Tinh Chỉnh Hiệu Quả Tài Nguyên (QLoRA)\nĐể phù hợp với điều kiện phần cứng của nhóm sinh viên, việc huấn luyện sẽ áp dụng phương pháp **QLoRA (Quantized Low-Rank Adaptation 4-bit)**:\n* **Cơ chế**: Đóng băng 99% trọng số gốc của mô hình ở định dạng 4-bit, chỉ huấn luyện các ma trận thích ứng nhỏ (Adapter weights với rank $r=16$, $\\alpha=32$).\n* **Yêu cầu phần cứng**: Chỉ cần **1 GPU dân dụng 16GB - 24GB VRAM** (như NVIDIA RTX 3090, RTX 4090 hoặc thuê máy ảo GPU giá rẻ ~$0.4/giờ trên RunPod/Google Colab Pro).\n* **Thời gian huấn luyện**: Khoảng 4 - 8 giờ cho một tập dữ liệu 5.000 - 10.000 mẫu cặp câu lâm sàng.\n\n#### 3. Mục Tiêu Của Việc Fine-Tuning (Không Phải Để Thay Thế RAG)\nNhóm xác định rõ ràng mục tiêu của việc Fine-tune mô hình cục bộ:\n* **KHÔNG dùng Fine-tuning để nhồi nhét phác đồ điều trị**: Việc lưu trữ và cập nhật phác đồ vẫn do **RAG** đảm nhiệm để đảm bảo tính tức thời và không bị ảo giác.\n* **MỤC TIÊU FINE-TUNING CHÍNH**:\n  1. **Hiểu sâu văn phong viết tắt & khẩu ngữ Bác sĩ Việt Nam**: Huấn luyện mô hình nhận diện chính xác các từ viết tắt chuyên ngành trong bệnh án (*\"bn nam 62t, tiền sử đtđ2 5 năm, ha 150/90, nghi ngờ vp cộng đồng, có ran nổ đáy phổi p\"*).\n  2. **Chuẩn hóa định dạng JSON đầu ra**: Đảm bảo mô hình luôn sinh ra đúng 100% cấu trúc JSON của Contract `CF-SVC-12`, không bao giờ bị lỗi cú pháp làm sập ứng dụng.\n  3. **Rèn luyện tính kỷ luật Grounding**: Huấn luyện mô hình học thói quen *\"chỉ trả lời dựa trên trích đoạn phác đồ được truyền vào prompt RAG\"* và chủ động từ chối khi tài liệu không có thông tin.\n\n---\n\n## 5. Thiết Kế Kỹ Thuật & Cài Đặt Phân Hệ RAG (Technical Architecture & Installation)\n\n### 5.1. Cơ Sở Dữ Liệu Vector: Tận Dụng PostgreSQL + `pgvector`\n\nThay vì phải dựng thêm một cụm cơ sở dữ liệu chuyên biệt như Pinecone hay Milvus gây tốn tài nguyên bảo trì, CareFlow tận dụng trực tiếp **PostgreSQL** hiện có bằng extension **`pgvector`**.\n\n#### Kịch Bản DDL Tạo Bảng Vector & Full-Text Search:\n\n```sql\n-- Kích hoạt extension pgvector trong PostgreSQL\nCREATE EXTENSION IF NOT EXISTS vector;\n\n-- Bảng lưu trữ tài liệu phác đồ gốc\nCREATE TABLE clinical_guideline_documents (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    code VARCHAR(100) UNIQUE NOT NULL,      -- Vd: 'BYT-QD-4800-HOHAP'\n    title VARCHAR(500) NOT NULL,            -- Vd: 'Hướng dẫn Chẩn đoán và Điều trị Bệnh Hô hấp'\n    issuer VARCHAR(255) NOT NULL,           -- 'Bộ Y Tế Việt Nam'\n    published_year INT NOT NULL,            -- 2023\n    specialty VARCHAR(100) NOT NULL,        -- 'Hô hấp'\n    source_url VARCHAR(1000),\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP\n);\n\n-- Bảng lưu trữ các chunk phác đồ kèm vector embedding và tsvector full-text\nCREATE TABLE clinical_guideline_chunks (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    document_id UUID NOT NULL REFERENCES clinical_guideline_documents(id) ON DELETE CASCADE,\n    section_title VARCHAR(300),             -- Vd: 'Tiêu chuẩn chẩn đoán Viêm phổi mắc phải cộng đồng'\n    content TEXT NOT NULL,                  -- Nội dung văn bản trích đoạn\n    metadata JSONB NOT NULL,                -- Chứa: icd10_codes, drugs_mentioned, severity_level, age_group\n    \n    -- Dense Vector Embedding (1024 chiều cho BGE-M3 hoặc 768 chiều cho Google text-embedding-004)\n    embedding VECTOR(1024),\n    \n    -- Sparse Full-Text Search Token Vector cho Tiếng Việt\n    tsv_content TSVECTOR GENERATED ALWAYS AS (to_tsvector('simple', content)) STORED,\n    \n    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP\n);\n\n-- Chỉ mục HNSW cho tìm kiếm Vector siêu tốc (Cosine Distance)\nCREATE INDEX idx_guideline_chunks_embedding_hnsw \nON clinical_guideline_chunks USING hnsw (embedding vector_cosine_ops)\nWITH (m = 16, ef_construction = 64);\n\n-- Chỉ mục GIN cho tìm kiếm từ khóa chính xác (BM25 / Full-text)\nCREATE INDEX idx_guideline_chunks_tsv \nON clinical_guideline_chunks USING gin (tsv_content);\n\n-- Chỉ mục JSONB cho việc lọc theo chuyên khoa và mã ICD-10\nCREATE INDEX idx_guideline_chunks_metadata ON clinical_guideline_chunks USING gin (metadata);\n```\n\n---\n\n### 5.2. Thuật Toán Hybrid Search Kết Hợp Reciprocal Rank Fusion (RRF)\n\nTại sao trong y tế **BẮT BUỘC** phải dùng Hybrid Search (Vector + Full-Text)?\n- **Vector Search thuần túy** giỏi hiểu ngữ nghĩa tương đồng (như nhận diện *\"khó thở\"* tương đồng với *\"suy hô hấp\"*), nhưng hay làm mờ các từ khóa chuyên biệt.\n- **Full-Text Search (Sparse BM25)** bắt buộc phải có để bắt chính xác 100% **tên thuốc biệt dược, hoạt chất** (như *Amoxicillin/Clavulanic acid* vs *Ampicillin*), **mã ICD-10** (*J18.0*), hoặc **ngưỡng số liệu** (*SpO2 < 92%*).\n\n```sql\n-- Hàm SQL thực thi Hybrid Search kết hợp RRF (Reciprocal Rank Fusion k=60)\nCREATE OR REPLACE FUNCTION search_clinical_guidelines_hybrid(\n    query_text TEXT,\n    query_embedding VECTOR(1024),\n    match_limit INT DEFAULT 20\n)\nRETURNS TABLE (\n    chunk_id UUID,\n    content TEXT,\n    section_title VARCHAR,\n    document_title VARCHAR,\n    rrf_score FLOAT\n) AS $$\nBEGIN\n    RETURN QUERY\n    WITH vector_matches AS (\n        SELECT \n            c.id,\n            ROW_NUMBER() OVER (ORDER BY c.embedding <=> query_embedding) AS v_rank\n        FROM clinical_guideline_chunks c\n        ORDER BY c.embedding <=> query_embedding\n        LIMIT match_limit\n    ),\n    keyword_matches AS (\n        SELECT \n            c.id,\n            ROW_NUMBER() OVER (ORDER BY ts_rank_cd(c.tsv_content, plainto_tsquery('simple', query_text)) DESC) AS k_rank\n        FROM clinical_guideline_chunks c\n        WHERE c.tsv_content @@ plainto_tsquery('simple', query_text)\n        ORDER BY ts_rank_cd(c.tsv_content, plainto_tsquery('simple', query_text)) DESC\n        LIMIT match_limit\n    )\n    SELECT \n        c.id AS chunk_id,\n        c.content,\n        c.section_title,\n        d.title AS document_title,\n        (COALESCE(1.0 / (60 + v.v_rank), 0.0) + COALESCE(1.0 / (60 + k.k_rank), 0.0))::FLOAT AS rrf_score\n    FROM vector_matches v\n    FULL OUTER JOIN keyword_matches k ON v.id = k.id\n    JOIN clinical_guideline_chunks c ON c.id = COALESCE(v.id, k.id)\n    JOIN clinical_guideline_documents d ON d.id = c.document_id\n    ORDER BY rrf_score DESC\n    LIMIT match_limit;\nEND;\n$$ LANGUAGE plpgsql;\n```\n\n---\n\n### 5.3. Chiến Lược Phân Đoạn Tài Liệu Y Tế (Hierarchical Semantic Chunking)\n\nTuyệt đối không cắt văn bản y tế theo số lượng ký tự ngẫu nhiên (Fixed-size 500 characters). Cắt cụt một câu chỉ định hoặc tách rời điều kiện chống chỉ định có thể gây sai lệch nghiêm trọng.\n\n**Quy tắc Semantic Chunking cho Phác đồ Bộ Y Tế**:\n1. Phân chia theo đề mục logic:\n   - `[Định nghĩa & Căn nguyên]`\n   - `[Tiêu chuẩn Chẩn đoán & Phân độ Nặng]` (kèm ngưỡng sinh hiệu SpO2, HA, Thân nhiệt).\n   - `[Phác đồ Xử trí Ban đầu & Phân tuyến Điều trị]`.\n   - `[Đơn thuốc Khuyến cáo Đầu tay (First-line) & Liều lượng]`.\n   - `[Chống chỉ định & Cảnh báo Dị ứng Thuốc]`.\n2. Giữ nguyên bảng biểu tương tác thuốc (Convert bảng Markdown/JSON giữ nguyên vẹn cặp thuốc tương tác và mức độ nghiêm trọng).\n3. Mỗi chunk duy trì độ dài từ 400 - 800 tokens, có overlap 100 tokens và luôn mang theo header phân cấp (Breadcrumb: *Bệnh Hô Hấp > Viêm phổi cộng đồng > Điều trị ngoại trú*).\n\n---\n\n### 5.4. Template Prompt Lâm Sàng Có Guardrails Nghiêm Ngặt\n\nKhi gửi ngữ cảnh lên LLM (Gemini 2.5 Flash), cấu trúc Prompt được chuẩn hóa như sau:\n\n```\n[SYSTEM INSTRUCTION: CAREFLOW CLINICAL DECISION SUPPORT GUARDRAILS]\nBạn là Trợ lý Hỗ trợ Quyết định Lâm sàng (CDSS) thuộc Hệ thống Bệnh viện CareFlow.\nNhiệm vụ của bạn là hỗ trợ Bác sĩ phân tích ca bệnh dựa trên Hướng dẫn của Bộ Y Tế Việt Nam.\n\nQUY TẮC BẮT BUỘC (STRICT MEDICAL GUARDRAILS):\n1. GROUNDING & TRÍCH DẪN NGUỒN: Mọi gợi ý chẩn đoán phân biệt, cận lâm sàng hay hướng điều trị PHẢI dựa trực tiếp trên [TÀI LIỆU PHÁC ĐỒ ĐƯỢC CUNG CẤP]. Không được suy diễn ngoài tài liệu.\n2. CITATION REF: Mỗi gợi ý phải gắn kèm mã trích dẫn cụ thể (Ví dụ: [Quyết định 4800/QĐ-BYT, Mục 3.2]).\n3. CẢNH BÁO TƯƠNG TÁC & DỊ ỨNG: Đối chiếu tiền sử dị ứng và các thuốc đang kê với Dược thư Quốc gia. Nếu phát hiện nguy cơ, in đậm cảnh báo [CẢNH BÁO NGUY CƠ CAO].\n4. KHÔNG THAY THẾ BÁC SĨ: Bác sĩ chịu trách nhiệm 100% quyết định lâm sàng. Luôn đính kèm Disclaimer ở cuối phản hồi.\n5. DỮ LIỆU CÒN THIẾU: Nếu các chỉ số sinh hiệu (SpO2, nhiệt độ...) chưa đủ để khẳng định chẩn đoán, liệt kê rõ ràng trong mục \"Dữ liệu cần khai thác thêm\".\n\n[NGỮ CẢNH BỆNH NHÂN THỰC TẾ (DYNAMIC CLINICAL SNAPSHOT TỪ ZUSTAND STORE)]:\n- Bệnh nhân: {patient.fullName}, Tuổi: {patient.age}, Giới: {patient.gender}\n- Sinh hiệu tức thời: SpO2: {vitals.spo2}%, Mạch: {vitals.heartRate} bpm, Huyết áp: {vitals.bloodPressure} mmHg, Thân nhiệt: {vitals.temperature} °C\n- Triệu chứng lâm sàng: {symptoms}\n- Chẩn đoán tạm thời của Bác sĩ: {diagnose} (ICD-10: {icd10Code})\n- Tiền sử bệnh & Dị ứng: {patient.allergies} | Bệnh nền: {patient.medicalHistory}\n- Đơn thuốc dự thảo: {draftPrescriptions}\n\n[TÀI LIỆU PHÁC ĐỒ CHUẨN TỪ BỘ Y TẾ (RETRIEVED GUIDELINE CHUNKS)]:\n---\nChunk 1: {chunk_1.content} (Nguồn: {chunk_1.document_title} - {chunk_1.section_title})\n---\nChunk 2: {chunk_2.content} (Nguồn: {chunk_2.document_title} - {chunk_2.section_title})\n---\n\n[YÊU CẦU CỦA BÁC SĨ]:\n{doctor_question}\n```\n\n---\n\n### 5.5. Chính Sách An Toàn AI & Nguyên Tắc \"Bác Sĩ Là Người Ra Quyết Định Cuối Cùng\" (Human-in-the-Loop AI Safety Policy)\n\nTrong lĩnh vực y tế, tính tự trị (autonomy) của AI phải bị giới hạn nghiêm ngặt. Hệ thống CareFlow được thiết kế xoay quanh nguyên tắc đạo đức và pháp lý y khoa: **AI chỉ là công cụ hỗ trợ ra quyết định lâm sàng (Clinical Decision Support - CDS), Bác sĩ là người duy nhất nắm quyền quyết định và chịu toàn bộ trách nhiệm chuyên môn trước bệnh nhân và pháp luật.**\n\nQuy định này được hiện thực hóa qua **4 Trụ Cột Kỹ Thuật Bắt Buộc**:\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#F8FAFC', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B', 'clusterBkg': '#F1F5F9', 'clusterBorder': '#CBD5E1' }}}%%\ngraph TD\n    P1[\"1. Tuyệt Đối Cấm Ghi Đè Tự Động<br/>(No Auto-Commit / No Auto-Save)\"]\n    P2[\"2. Bác Sĩ Chủ Động Tiếp Nhận & Sửa<br/>(Review ➔ Edit ➔ 1-Click Accept)\"]\n    P3[\"3. Miễn Trừ Trách Nhiệm Pháp Lý<br/>(Bắt buộc Disclaimer trên mọi Response)\"]\n    P4[\"4. Nhật Ký Kiểm Toán Lâm Sàng<br/>(Audit Trail lưu Interaction ID & Trích dẫn)\"]\n```\n\n#### 1. Tuyệt Đối Cấm Tự Động Ghi Đè (No Auto-Commit / No Auto-Save)\n* **Quy tắc**: AI hoàn toàn **KHÔNG CÓ QUYỀN GHI (Write-Permissions)** trực tiếp vào bất kỳ cơ sở dữ liệu bệnh án chính thức nào:\n  * AI không thể tự ý lưu chẩn đoán vào hồ sơ khám bệnh (`consultation`).\n  * AI không thể tự ý tạo chỉ định Cận lâm sàng (`lab_orders`).\n  * AI không thể tự ý kê đơn hoặc gửi lệnh phát thuốc sang Quầy dược (`prescriptions`).\n* **Kỹ thuật**: Mọi kết quả do AI sinh ra chỉ nằm ở trạng thái **\"Gợi ý / Tạm thời (Staging State)\"** hiển thị trên giao diện Tab AI (`activeTab === 'ai'`). Nếu Bác sĩ không thao tác gì và chuyển tab khác hoặc đóng trình duyệt, toàn bộ gợi ý này sẽ tự động hủy, không để lại bất kỳ rác dữ liệu nào trong bệnh án.\n\n#### 2. Cơ Chế Bác Sĩ Chủ Động Tiếp Nhận & Chỉnh Sửa (Explicit Human Affirmation)\n* **Quy tắc**: Mọi thông tin từ AI muốn trở thành dữ liệu bệnh án bắt buộc phải trải qua thao tác nhấp chuột có ý thức của Bác sĩ:\n  * **Sao chép Chẩn đoán**: Bác sĩ phải bấm nút `[Sao chép vào ô Chẩn đoán]` (`setDiagnosis(item.text)`). Khi dữ liệu nhảy sang ô input chẩn đoán chính thức, Bác sĩ vẫn có toàn quyền gõ phím chỉnh sửa, thêm bớt từ ngữ theo nhận định lâm sàng thực tế của mình.\n  * **Kê đơn thuốc**: AI chỉ gợi ý tên hoạt chất và liều khuyến cáo theo phác đồ. Bác sĩ phải là người trực tiếp chọn thuốc từ danh mục thuốc thực tế của phòng khám, điều chỉnh liều cụ thể theo thể trạng người bệnh và bấm nút *\"Ký & Xác nhận đơn thuốc\"*.\n* **Từ chối gợi ý**: Bác sĩ có thể bỏ qua hoặc bấm nút *\"Bỏ qua gợi ý\"* bất cứ lúc nào nếu nhận thấy phân tích của AI không phù hợp với bệnh cảnh lâm sàng thực tế.\n\n#### 3. Tuyên Bố Miễn Trừ Trách Nhiệm Bắt Buộc (Mandatory Legal Disclaimer)\n* **Quy chuẩn Contract CF-SVC-12**: Mọi phản hồi API từ `careflow-ai-service` (cả gợi ý phác đồ và giải đáp thắc mắc) bắt buộc phải trả về trường `disclaimer`:\n  > *\"Gợi ý hỗ trợ lâm sàng từ CareFlow AI. Bác sĩ chịu trách nhiệm hoàn toàn đối với quyết định chẩn đoán và chỉ định điều trị.\"*\n* **Giao diện người dùng (`doctor-web`)**: Bắt buộc render thanh cảnh báo Disclaimer ở cuối khung trò chuyện AI với huy hiệu cảnh báo rõ ràng, không được ẩn giấu hay làm mờ dòng thông báo này.\n\n#### 4. Nhật Ký Kiểm Toán & Truy Vết Lâm Sàng (Clinical Audit Trail & Traceability)\n* Khi Bác sĩ sử dụng AI để tham vấn ca bệnh, hệ thống tự động sinh một mã giao dịch `interactionId` (UUID) và lưu vết:\n  * `doctorId`: Mã định danh Bác sĩ đang trực.\n  * `consultationId`: Mã ca khám bệnh.\n  * `model`: Nhà cung cấp, tên mô hình và phiên bản (ví dụ: `gemini-2.5-flash`).\n  * `evidenceRefs`: Danh sách các điều khoản phác đồ Bộ Y Tế mà AI đã trích dẫn để đưa ra gợi ý đó.\n  * `timestamp` & `latencyMs`: Thời điểm và thời gian xử lý.\n* **Mục đích**: Phục vụ việc giải trình chuyên môn, hội chẩn viện hoặc đối soát y khoa khi có tranh chấp lâm sàng, đảm bảo tính minh bạch (Explainability) tối đa cho bệnh viện.\n\n---\n\n## 6. Khảo Sát Hiện Trạng Hệ Thống CareFlow Qua GitNexus & Phân Tích Gap\n\nDựa trên kết quả rà soát GitNexus Call Graph và cấu trúc mã nguồn hiện tại của dự án:\n\n### 6.1. Những Gì CareFlow ĐÃ CÓ (As-Is State)\n1. **Frontend (`frontend/doctor-web`)**:\n   - Đã có trang khám bệnh chi tiết `consultation/[id]/page.tsx` với giao diện 5 tab lâm sàng và Tab 6 (`activeTab === 'ai'`).\n   - Đã có component `AiAssistantWidget.tsx` (nhưng đang cào DOM `innerText`).\n   - Đã có thư viện gọi API `src/lib/ai-api.ts` kết nối đến endpoint `/api/ai/clinical-suggestions` và `/api/ai/clinical-chat`.\n2. **Backend (`careflow-ai-service`)**:\n   - Đã có khung Spring Boot 3.3.4 chạy trên cổng `8091`.\n   - Đã có controller `AiClinicalController.java` và service `AiClinicalAssistantService.java`.\n   - Đã có client tích hợp API với Google Gemini (`GeminiClientService`) và DeepSeek (`DeepSeekClientService`).\n3. **Cơ Sở Dữ Liệu**:\n   - Hệ thống dùng PostgreSQL tập trung (`100.116.233.60:5432`), đã có sẵn CSDL thuốc trong `careflow-prescription-service` (`drugs_dictionary`).\n\n---\n\n### 6.2. Phân Tích Gap: Những Gì CẦN SỬA ĐỔI & LÀM MỚI (To-Be State)\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#FFFFFF', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B', 'clusterBkg': '#F8FAFC', 'clusterBorder': '#CBD5E1', 'titleColor': '#0F172A' }}}%%\ngraph TD\n    subgraph GapAnalysis[\"Khoảng Trống Cần Bổ Sung (Gap Analysis)\"]\n        G1[\"Frontend: Chưa có Zustand Store<br/>Chưa lưu metrics & diagnose đồng bộ\"]\n        G2[\"Backend: Chưa có CSDL pgvector<br/>Prompt chỉ nối string đơn giản không có RAG\"]\n        G3[\"Data: Chưa nạp Phác đồ Bộ Y Tế<br/>Chưa có Ingestion Pipeline\"]\n    end\n\n    subgraph ActionPlan[\"Hành Động Khắc Phục Cụ Thể\"]\n        A1[\"Cài zustand, tạo useClinicalWorkspaceStore.ts<br/>Refactor Tab AI & Widget đọc snapshot on-demand\"]\n        A2[\"Thêm spring-boot-starter-data-jpa & pgvector<br/>Xây dựng ClinicalRagService & Hybrid Search\"]\n        A3[\"Xây dựng CLI Ingestion tool nạp PDF/MD phác đồ BYT<br/>Tạo Embedding & nạp vào PostgreSQL\"]\n    end\n\n    G1 --> A1\n    G2 --> A2\n    G3 --> A3\n```\n\n#### Chi Tiết Thay Đổi Mã Nguồn:\n1. **Frontend (`frontend/doctor-web`)**:\n   - `package.json`: Cài đặt thư viện `zustand`.\n   - Thêm mới `src/stores/useClinicalWorkspaceStore.ts` để lưu trữ SpO2, nhiệt độ, huyết áp, mạch, triệu chứng và chẩn đoán tạm thời (`diagnose`).\n   - Chỉnh sửa `consultation/[id]/page.tsx`: Cập nhật logic chuyển tab `activeTab === 'ai'`, bốc dữ liệu snapshot sạch từ Zustand store gửi kèm lên API thay vì chỉ gửi ID rỗng.\n   - Chỉnh sửa `AiAssistantWidget.tsx`: Loại bỏ triệt để đoạn cào DOM `document.querySelector(\"main\").innerText`, thay bằng `useClinicalWorkspaceStore.getState().getClinicalSnapshot()`.\n2. **Backend (`careflow-ai-service`)**:\n   - `pom.xml`: Mở lại cấu hình JPA, thêm dependency `com.pgvector:pgvector:0.1.6` và PostgreSQL Driver.\n   - `application.yml`: Cấu hình kết nối datasource tới PostgreSQL remote server (`100.116.233.60:5432/careflow_ai`).\n   - Thêm package `com.careflow.ai.rag`:\n     - `entity/ClinicalGuidelineDocument.java` & `ClinicalGuidelineChunk.java`.\n     - `repository/ClinicalGuidelineRepository.java` (hỗ trợ Native Query Hybrid Search RRF).\n     - `service/EmbeddingClientService.java` (gọi Google `text-embedding-004` hoặc BGE-M3 API).\n     - `service/ClinicalRagService.java` (điều phối Hybrid Search + LLM Prompting).\n3. **Database & Schema**:\n   - Cập nhật file `.planning/ai-service/ai-service-db.dbml` định nghĩa 2 bảng `clinical_guideline_documents` và `clinical_guideline_chunks`.\n\n---\n\n## 7. Đánh Giá Phân Hệ AI Voice: ElevenLabs vs. Native Audio vs. Whisper\n\n### 7.1. Đánh Giá Thực Trạng\nHệ thống hiện tại có endpoint `/api/ai/voice-to-clinical-fields` nhận file ghi âm từ micro Bác sĩ, gửi sang **ElevenLabs Scribe v1** để chuyển thành text, sau đó đưa chuỗi text qua **Google Gemini** để bóc tách thành 11 trường lâm sàng JSON.\n\n**Hạn chế hiện tại**:\n- Độ trễ 2 chặng mạng (2-hop latency) khiến bác sĩ phải chờ 4 - 8 giây.\n- Chi phí kép (tính tiền trên cả ElevenLabs và Gemini).\n\n### 7.2. Định Hướng Nâng Cấp Tương Lai\n\n1. **Lộ trình Ngắn hạn (Khuyến nghị số 1)**: Nâng cấp lên **Gemini 2.5 Flash Native Multimodal Audio**.\n   - Gửi trực tiếp file audio ghi âm từ Frontend lên Gemini thông qua Spring Boot.\n   - Gemini xử lý âm thanh tự nhiên, trích xuất thẳng JSON 11 trường lâm sàng chỉ trong 1.5 - 2.5 giây, cắt bỏ hoàn toàn ElevenLabs và giảm 60% chi phí.\n2. **Lộ trình Dài hạn (On-Premise Hospital Deployment)**:\n   - Triển khai **OpenAI Whisper (bản Large-v3 hoặc Turbo)** trên máy chủ GPU nội bộ của Bệnh viện. Đảm bảo bảo mật âm thanh y tế 100%, không truyền dữ liệu ra ngoài Internet.\n\n---\n\n## 8. Kế Hoạch Triển Khai Chi Tiết Cho Nhóm (Roadmap)\n\nKế hoạch được chia thành 4 giai đoạn cụ thể để các bạn trong nhóm dễ phân chia công việc:\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#F8FAFC', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B' }}}%%\nflowchart LR\n    P1[\"Giai đoạn 1 (Tuần 1)<br/>Frontend & Zustand Store\"] --> P2[\"Giai đoạn 2 (Tuần 2)<br/>CSDL pgvector & Dữ liệu\"]\n    P2 --> P3[\"Giai đoạn 3 (Tuần 3)<br/>Backend RAG & Hybrid Search\"]\n    P3 --> P4[\"Giai đoạn 4 (Tuần 4)<br/>Kiểm thử Lâm sàng & Đánh giá\"]\n```\n\n#### Bảng Kế Hoạch Triển Khai Chi Tiết (Roadmap Table):\n\n| Giai đoạn | Mục tiêu chính | Nhiệm vụ kỹ thuật then chốt | Sản phẩm bàn giao (Deliverables) |\n|---|---|---|---|\n| **Giai đoạn 1** (Tuần 1) | **Frontend & Zustand Store** | - Cài đặt gói `zustand` trong `doctor-web`<br/>- Tạo `useClinicalWorkspaceStore.ts` lưu SpO2, nhiệt độ, huyết áp, chẩn đoán<br/>- Nối sự kiện Tab AI Pull-on-Demand (0% re-render) | - Store Zustand hoàn chỉnh<br/>- Giao diện Tab AI lấy snapshot sạch tức thì |\n| **Giai đoạn 2** (Tuần 2) | **Dữ liệu & CSDL pgvector** | - Kích hoạt extension `vector` trên PostgreSQL Remote<br/>- Thu thập 5 văn bản phác đồ Bộ Y Tế & Dược thư QG<br/>- Viết Ingestion Script nạp Vector Embeddings (BGE-M3/Google) | - Bảng CSDL `clinical_guideline_chunks`<br/>- Kho tri thức phác đồ sẵn sàng tra cứu |\n| **Giai đoạn 3** (Tuần 3) | **Backend RAG Engine** | - Tích hợp Spring Data JPA + pgvector native query<br/>- Xây dựng `ClinicalRagService` & Hybrid Search (RRF)<br/>- Ghép Prompt Guardrail có trích dẫn nguồn `evidenceRefs` | - API Suggestions trả về JSON có trích dẫn<br/>- Phản hồi lâm sàng bám sát phác đồ BYT |\n| **Giai đoạn 4** (Tuần 4) | **Kiểm thử Lâm sàng** | - Thử nghiệm 20 ca bệnh thực tế với Bác sĩ lâm sàng<br/>- Đo lường và tối ưu độ trễ phản hồi (< 2.0s)<br/>- Kiểm tra chặn 100% ảo giác đối với thuốc ngoài danh mục | - Báo cáo đánh giá FactScore & Faithfulness<br/>- Nghiệm thu tính năng hoàn chỉnh cho nhóm |\n\n### 8.1. Chi Tiết Phân Công Công Việc Theo 4 Giai Đoạn\n\n#### Giai đoạn 1: Chuẩn Hóa Quản Lý Ngữ Cảnh Frontend (Frontend Engineer)\n- [ ] Cài đặt gói `zustand` trong `frontend/doctor-web`.\n- [ ] Triển khai `useClinicalWorkspaceStore.ts` hỗ trợ lưu: Vitals (SpO2, nhiệt độ, huyết áp, mạch), Triệu chứng, Chẩn đoán tạm thời (`diagnose`), Dị ứng, Đơn thuốc dự thảo.\n- [ ] Áp dụng mẫu \"Isolated Input Island\" và \"Debounced Sync\" để đảm bảo 0% giật lag re-render khi Bác sĩ gõ phím.\n- [ ] Nối sự kiện chuyển Tab AI (`activeTab === 'ai'`) để kích hoạt gợi ý lâm sàng tức thì từ snapshot có cấu trúc.\n\n#### Giai đoạn 2: Chuẩn Bị Dữ Liệu Y Khoa & Hạ Tầng Vector (Data / AI Engineer)\n- [ ] Kích hoạt extension `vector` trên PostgreSQL Remote Server.\n- [ ] Thực thi kịch bản tạo bảng `clinical_guideline_documents` và `clinical_guideline_chunks`.\n- [ ] Thu thập 5 văn bản phác đồ điều trị nền tảng của Bộ Y Tế (Hô hấp, Tim mạch, Đái tháo đường, Truyền nhiễm, Cấp cứu).\n- [ ] Viết kịch bản Ingestion Pipeline (Semantic Chunking theo đề mục y tế, tạo Vector Embedding qua Google `text-embedding-004` hoặc `bge-m3`).\n\n#### Giai đoạn 3: Triển Khai RAG Service & Hybrid Search (Backend Engineer)\n- [ ] Bổ sung `spring-boot-starter-data-jpa` và driver PostgreSQL trong `careflow-ai-service`.\n- [ ] Hiện thực hàm Hybrid Search kết hợp Reciprocal Rank Fusion (RRF k=60) trong Repository.\n- [ ] Xây dựng dịch vụ `ClinicalRagService.java` điều phối tìm kiếm và ghép nối Context vào System Prompt Guardrail.\n- [ ] Cập nhật API Response trả về danh sách trích dẫn bằng chứng (`evidenceRefs`) trỏ về đúng Quyết định của Bộ Y Tế.\n\n#### Giai đoạn 4: Đánh Giá Độ An Toàn & Trải Nghiệm Bác Sĩ (Full Team & Medical Advisors)\n- [ ] Kiểm thử 20 ca bệnh lâm sàng phức tạp (có tương tác thuốc, sốt cao kèm SpO2 tụt, tiền sử dị ứng Penicillin).\n- [ ] Đo lường độ trễ: Đảm bảo thời gian từ lúc bấm Tab AI đến khi hiển thị gợi ý không vượt quá **2.0 giây**.\n- [ ] Kiểm tra khả năng chặn 100% ảo giác đối với các loại thuốc không có trong Dược thư Quốc gia.\n\n---\n\n## 9. Hướng Dẫn Triển Khai Thực Chiến Từ A Đến Z (End-to-End Implementation Guide)\n\nMục này tổng hợp toàn bộ lý thuyết cốt lõi (từ `theory.md`), quy chuẩn dữ liệu, hướng dẫn cài đặt môi trường và các bước thực hành chi tiết từ số 0 cho đến khi kiểm thử thành công dịch vụ **Doctor AI Chat / Clinical Decision Support System (CDSS)**.\n\nToàn bộ quy trình triển khai thực tế được cấu trúc chuẩn hóa theo **5 Giai Đoạn (5-Stage RAG Pipeline)**:\n\n```mermaid\n%%{init: {'theme': 'neutral', 'themeVariables': { 'fontSize': '12px', 'primaryColor': '#F8FAFC', 'primaryBorderColor': '#94A3B8', 'primaryTextColor': '#0F172A', 'lineColor': '#64748B' }}}%%\nflowchart LR\n    P1[\"Phase 1: Ingestion<br/>(Thu thập BYT, DDI)\"] --> P2[\"Phase 2: Indexing<br/>(Breadcrumbs & Vector)\"]\n    P2 --> P3[\"Phase 3: Retrieval<br/>(Hybrid Search pgvector)\"]\n    P3 --> P4[\"Phase 4: Augmentation<br/>(Zustand Snapshot Prompt)\"]\n    P4 --> P5[\"Phase 5: Generation<br/>(Gemini & Verification)\"]\n```\n\n---\n\n### 9.1. Nền Tảng Lý Thuyết Cốt Lõi: Embeddings, Vector DB & pgvector\n\n#### 1. Bản chất của Vector Embeddings\n* **Vector Embedding** là biểu diễn toán học của một đoạn văn bản dưới dạng một chuỗi số thực nhiều chiều (ví dụ: 768 chiều từ Google `text-embedding-004` hoặc 1024 chiều từ `BAAI/bge-m3`).\n* **Định vị ngữ nghĩa (Semantic Space):** Các văn bản có ngữ nghĩa tương đồng sẽ nằm gần nhau trong không gian đa chiều, bất kể từ ngữ khác nhau. Ví dụ: *\"Bệnh nhân bị đái tháo đường\"* và *\"Người bệnh mắc tiểu đường type 2\"* có khoảng cách hình học gần sát nhau.\n* **Các phép đo khoảng cách trong `pgvector`**:\n  * **Cosine Distance (`<=>`)**: $1 - \\cos(\\theta)$ (Góc giữa 2 vector, không phụ thuộc độ dài vector) $\\rightarrow$ **Chuẩn tối ưu nhất cho Text Retrieval**.\n  * **L2 Euclidean Distance (`<->`)**: $\\sqrt{\\sum (u_i - v_i)^2}$ (Khoảng cách đường thẳng hình học).\n  * **Inner Product / Dot Product (`<#>`):** $- (u \\cdot v)$ (Tích vô hướng, tính toán cực nhanh khi vector đã được chuẩn hóa L2).\n\n#### 2. Vector Database & Tại Sao Chọn `pgvector`?\n* **PostgreSQL + `pgvector`** biến CSDL quan hệ sẵn có thành Vector DB mà không cần cài đặt thêm cụm dịch vụ bên thứ ba (Pinecone, Milvus, Qdrant):\n  * **Hạ tầng All-in-One:** Dữ liệu hồ sơ bệnh án, danh mục thuốc và vector phác đồ nằm chung một hệ thống, dễ backup và quản trị.\n  * **Đảm bảo tính ACID:** Kế thừa trọn vẹn độ tin cậy và phân quyền bảo mật của PostgreSQL.\n  * **Hybrid Search (Sát thủ trong Y tế):** Cho phép kết hợp bộ lọc cứng SQL (`WHERE specialty = 'PEDIATRICS'`) và tìm kiếm tương đồng vector (`ORDER BY embedding <=> query_vector`) trong cùng một câu truy vấn duy nhất.\n* **Chỉ mục ANN (Approximate Nearest Neighbor) trong pgvector**:\n  * Khi cơ sở dữ liệu có hàng chục nghìn vector 768 chiều, nếu so sánh tuần tự (Exact Scan), truy vấn sẽ mất hàng trăm mili-giây đến vài giây ($O(N)$). `pgvector` cung cấp 2 giải thuật lập chỉ mục ANN để đưa độ phức tạp về $O(\\log N)$ hoặc $O(\\sqrt{N})$.\n\n#### 3. So Sánh Chi Tiết Giải Thuật Indexing: HNSW vs. IVFFlat\n\n| Tiêu Chí Kỹ Thuật | IVFFlat (Inverted File Flat) | HNSW (Hierarchical Navigable Small World) — *Chuẩn CareFlow* |\n| :--- | :--- | :--- |\n| **Cơ chế hoạt động** | **Phân cụm không gian (Voronoi Cells):** Gom vector thành $K$ cụm bằng thuật toán k-means. Khi tìm kiếm, chỉ quét qua các cụm gần tâm truy vấn nhất. | **Đồ thị đa tầng (Multi-layer Skip Graph):** Xây dựng mạng lưới liên kết nhiều tầng. Tầng cao nhảy bước dài (cao tốc), tầng thấp duyệt chi tiết cục bộ (ngõ hẻm). |\n| **Tốc độ truy vấn (Latency)** | Trung bình (**30ms – 80ms**), chậm dần khi số lượng cụm cần quét (`probes`) tăng lên. | **Siêu nhanh (< 15ms)**, đáp ứng xuất sắc yêu cầu thời gian thực của Bác sĩ khi khám bệnh. |\n| **Độ chính xác (Recall)** | **Thấp hơn (80% – 90%):** Dễ bị bỏ sót dữ liệu nếu vector mục tiêu nằm sát ranh giới giữa 2 cụm khác nhau. | **Rất cao (> 95% – 98%):** Đồ thị đa liên kết đảm bảo hầu như không bao giờ bỏ sót phác đồ liên quan. |\n| **Yêu cầu dữ liệu ban đầu** | **Bắt buộc phải có sẵn dữ liệu**: Cần nạp đủ tài liệu trước rồi mới chạy lệnh `CREATE INDEX` để phân cụm k-means hiệu quả. | **Nạp động (Streaming Inserts)**: Có thể tạo index ngay từ đầu, nạp thêm từng file PDF phác đồ mới mà không cần train lại. |\n| **Mức tiêu thụ RAM** | **Thấp (1x)**: Tốn ít bộ nhớ RAM, phù hợp máy chủ cấu hình rất yếu. | **Cao hơn (1.5x – 2x)**: Cần thêm RAM để lưu cấu trúc đồ thị liên kết giữa các node. |\n| **Thời gian tạo Index (Build Time)** | Rất nhanh. | Lâu hơn IVFFlat một chút do phải xây dựng đồ thị liên kết đa tầng. |\n| **Rủi ro Lâm sàng Y tế** | ⚠️ **Nguy hiểm**: Nếu bỏ sót một chunk chứa *\"chống chỉ định dùng thuốc\"* do nằm ở ranh giới cụm, AI có thể đưa ra gợi ý gây nguy hiểm tính mạng. | ✅ **An toàn tuyệt đối**: Độ phủ recall >95% đảm bảo trích xuất trọn vẹn các cảnh báo y tế quan trọng nhất. |\n\n\n\n<div class=\"callout callout-important\"><strong>⚠️ QUAN TRỌNG:</strong><br/>**Quyết định Kỹ thuật của CareFlow**:\nMặc dù HNSW tốn RAM hơn IVFFlat, đối với hệ thống y tế **\"Tính mạng và Độ an toàn lâm sàng là ưu tiên số 1\"**. Bác sĩ không thể chấp nhận việc AI phản hồi chậm trễ hay bỏ sót phác đồ điều trị của Bộ Y Tế. Vì vậy, CareFlow chuẩn hóa sử dụng **HNSW Index với cấu hình cân bằng tối ưu**:\n```sql\nUSING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64);\n```\n*(Trong đó `m = 16` đảm bảo mỗi đoạn phác đồ liên kết với 16 đoạn lân cận, `ef_construction = 64` tối ưu độ sắc nét của đồ thị mà không làm nghẽn CPU khi nạp dữ liệu).*\n</div>\n\n\n---\n\n### 9.2. [Phase 1: Ingestion] Thu Thập & Chuẩn Hóa Dữ Liệu Y Khoa\n\nĐể xây dựng kho tri thức y khoa đáng tin cậy cho CareFlow, nhóm cần thu thập **3 nhóm dữ liệu then chốt**:\n\n```mermaid\nflowchart TD\n    subgraph DataSources[\"Kho Dữ Liệu Cần Thu Thập\"]\n        D1[\"1. Văn Bản Phác Đồ Bộ Y Tế (PDF)\\n- QĐ 4068: Sốt xuất huyết Dengue\\n- QĐ 4800: Viêm phổi & Bệnh Hô hấp\\n- QĐ 5968: Tăng huyết áp người lớn\\n- QĐ 5481: Đái tháo đường Type 2\"]\n        D2[\"2. Dược Thư Quốc Gia (DDI & Chống chỉ định)\\n- Danh mục hoạt chất tương tác nguy hiểm\\n- Cảnh báo dị ứng chéo (vd: Penicillin & Cephalosporin)\"]\n        D3[\"3. Danh Mục Mã Bệnh ICD-10 Tiếng Việt\\n- Bảng mã chẩn đoán quốc tế có mô tả tiếng Việt\"]\n    end\n    DataSources --> IngestionPipeline[\"Ingestion Pipeline\"]\n```\n\n1. **Văn bản Hướng dẫn Chẩn đoán & Điều trị của Bộ Y Tế (Dạng PDF)**:\n   * Thu thập 3 - 5 văn bản nền tảng ban đầu (MVP):\n     * *Quyết định 4068/QĐ-BYT (2023):* Hướng dẫn chẩn đoán, điều trị Sốt xuất huyết Dengue.\n     * *Quyết định 4800/QĐ-BYT (2020):* Hướng dẫn chẩn đoán và điều trị các bệnh về Hô hấp (đặc biệt: Viêm phổi cộng đồng).\n     * *Quyết định 5968/QĐ-BYT:* Hướng dẫn chẩn đoán và điều trị Tăng huyết áp.\n     * *Quyết định 5481/QĐ-BYT:* Hướng dẫn chẩn đoán và điều trị Đái tháo đường Type 2.\n2. **Dược Thư Quốc Gia & Bảng Tương Tác Thuốc (DDI - Drug-Drug Interactions)**:\n   * Danh mục các cặp hoạt chất có tương tác chống chỉ định tuyệt đối (ví dụ: *Simvastatin + Clarithromycin*, *Aspirin + Warfarin*).\n3. **Danh mục mã chuẩn ICD-10**:\n   * Danh sách mã ICD-10 kèm mô tả tiếng Việt chuẩn của Bộ Y tế để đối chiếu chẩn đoán của Bác sĩ.\n\n---\n\n### 9.3. [Prerequisites] Thiết Lập Môi Trường, CSDL pgvector & Schema Bảng\n\n#### Bước 1: Kích hoạt `pgvector` trên PostgreSQL\n* Nếu chạy qua **Docker** (khuyên dùng khi phát triển cục bộ):\n  ```yaml\n  # docker-compose.yml\n  services:\n    postgres:\n      image: pgvector/pgvector:pg16\n      environment:\n        POSTGRES_DB: careflow_ai\n        POSTGRES_USER: postgres\n        POSTGRES_PASSWORD: password\n      ports:\n        - \"5432:5432\"\n  ```\n* Nếu kết nối **Remote Database** (`100.116.233.60:5432`):\n  Đăng nhập bằng `psql` hoặc DBeaver và chạy lệnh kích hoạt extension:\n  ```sql\n  CREATE EXTENSION IF NOT EXISTS vector;\n  ```\n\n#### Bước 2: Tạo Schema Bảng Dữ Liệu Y Khoa & Index HNSW\nChạy đoạn mã SQL DDL sau trong database `careflow_ai`:\n\n```sql\n-- 1. Bảng tài liệu nguồn gốc\nCREATE TABLE IF NOT EXISTS clinical_guideline_documents (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    code VARCHAR(100) UNIQUE NOT NULL,      -- 'BYT-QD-4068-DENGUE'\n    title VARCHAR(500) NOT NULL,\n    issuer VARCHAR(255) NOT NULL DEFAULT 'Bộ Y Tế Việt Nam',\n    published_year INT NOT NULL,\n    specialty VARCHAR(100) NOT NULL,        -- 'TRUYEN_NHIEM', 'HO_HAP', 'TIM_MACH'\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP\n);\n\n-- 2. Bảng các chunk phác đồ kèm vector embedding\nCREATE TABLE IF NOT EXISTS clinical_guideline_chunks (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    document_id UUID NOT NULL REFERENCES clinical_guideline_documents(id) ON DELETE CASCADE,\n    section_title VARCHAR(300),             -- Breadcrumb tiêu đề\n    content TEXT NOT NULL,                  -- Nội dung văn bản chunk\n    metadata JSONB NOT NULL DEFAULT '{}'::jsonb, -- Chứa: icd10, drugs, warning_level\n    embedding VECTOR(768) NOT NULL,         -- Vector 768 chiều (Google text-embedding-004)\n    tsv_content TSVECTOR GENERATED ALWAYS AS (to_tsvector('simple', content)) STORED,\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP\n);\n\n-- 3. Tạo chỉ mục HNSW cho Vector Search siêu tốc\nCREATE INDEX IF NOT EXISTS idx_clinical_chunks_hnsw \nON clinical_guideline_chunks USING hnsw (embedding vector_cosine_ops)\nWITH (m = 16, ef_construction = 64);\n\n-- 4. Tạo chỉ mục GIN cho Full-Text Search từ khóa\nCREATE INDEX IF NOT EXISTS idx_clinical_chunks_tsv \nON clinical_guideline_chunks USING gin (tsv_content);\n\n-- 5. Tạo chỉ mục JSONB để lọc nhanh theo metadata\nCREATE INDEX IF NOT EXISTS idx_clinical_chunks_meta \nON clinical_guideline_chunks USING gin (metadata);\n```\n\n#### Bước 3: Cài đặt Dependencies cho Ingestion Pipeline (Python)\nTạo thư mục công cụ Ingestion `scripts/rag-ingestion/` và cài đặt các thư viện cần thiết:\n```bash\npip install pymupdf psycopg2-binary pgvector google-genai\n```\n\n#### Bước 4: Cài đặt Dependencies cho Backend (`careflow-ai-service`)\nTrong `pom.xml` của microservice `careflow-ai-service`:\n```xml\n<!-- Spring Data JPA & PostgreSQL Driver -->\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-data-jpa</artifactId>\n</dependency>\n<dependency>\n    <groupId>org.postgresql</groupId>\n    <artifactId>postgresql</artifactId>\n    <scope>runtime</scope>\n</dependency>\n\n<!-- pgvector java support -->\n<dependency>\n    <groupId>com.pgvector</groupId>\n    <artifactId>pgvector</artifactId>\n    <version>0.1.6</version>\n</dependency>\n\n<!-- Google GenAI SDK (Gemini & Embeddings) -->\n<dependency>\n    <groupId>com.google.genai</groupId>\n    <artifactId>google-genai</artifactId>\n    <version>0.1.1</version>\n</dependency>\n```\n\n---\n\n### 9.4. [Phase 2: Chunking & Indexing] Quy Trình Chuyển Đổi PDF Sang Vector (PDF to Vector Pipeline)\n\nQuy trình tự động hóa biến file PDF thô của Bộ Y Tế thành các Vector đã lập chỉ mục:\n\n```mermaid\nflowchart LR\n    PDF[\"1. File PDF QĐ Bộ Y Tế\"] --> PyMuPDF[\"2. Extract text & layout\\n(PyMuPDF fitz)\"]\n    PyMuPDF --> Structure[\"3. Bóc tách Heading\\n& Khử số trang\"]\n    Structure --> Chunking[\"4. Semantic Chunking\\n+ Breadcrumb Injection\"]\n    Chunking --> Embed[\"5. Google text-embedding-004\\n(Sinh vector 768 chiều)\"]\n    Embed --> DB[(\"6. Insert PostgreSQL\\npgvector + HNSW\")]\n```\n\n#### Kịch Bản Ingestion Mẫu Hoàn Chỉnh (`scripts/rag-ingestion/ingest.py`):\n\n```python\nimport os\nimport json\nimport fitz  # PyMuPDF\nimport psycopg2\nfrom pgvector.psycopg2 import register_vector\nfrom google import genai\n\n# Cấu hình Database & Gemini API\nDB_CONFIG = \"dbname=careflow_ai user=postgres password=password host=localhost port=5432\"\nGEMINI_API_KEY = os.environ.get(\"GEMINI_API_KEY\", \"your-api-key\")\nclient = genai.Client(api_key=GEMINI_API_KEY)\n\ndef get_embedding(text: str) -> list[float]:\n    \"\"\"Sinh vector 768 chiều từ Google text-embedding-004\"\"\"\n    response = client.models.embed_content(\n        model=\"text-embedding-004\",\n        contents=text\n    )\n    return response.embeddings[0].values\n\ndef extract_and_chunk_pdf(pdf_path: str, doc_title: str):\n    \"\"\"Đọc PDF, khử nhiễu và chia nhỏ văn bản theo đề mục kèm Breadcrumb\"\"\"\n    doc = fitz.open(pdf_path)\n    full_text = \"\"\n    for page in doc:\n        text = page.get_text(\"text\")\n        # Khử dòng số trang và header thừa\n        lines = [l for l in text.split(\"\\n\") if not l.strip().isdigit() and \"Trang\" not in l]\n        full_text += \"\\n\".join(lines) + \"\\n\"\n    \n    # Chia chunk theo các mục lớn (Giả lập Semantic Chunking dựa trên Heading)\n    raw_sections = full_text.split(\"\\n## \")\n    chunks = []\n    \n    for section in raw_sections:\n        if not section.strip():\n            continue\n        lines = section.strip().split(\"\\n\")\n        section_title = lines[0].strip()\n        body = \"\\n\".join(lines[1:]).strip()\n        \n        if len(body) < 50:  # Bỏ qua các mục quá ngắn\n            continue\n            \n        # KỸ THUẬT BREADCRUMB INJECTION: Bơm ngữ cảnh cha vào đầu chunk\n        breadcrumb_content = f\"[{doc_title} > {section_title}]\\n{body}\"\n        \n        chunks.append({\n            \"section_title\": section_title,\n            \"content\": breadcrumb_content\n        })\n    return chunks\n\ndef ingest_to_database(pdf_path: str, doc_code: str, title: str, specialty: str, year: int):\n    conn = psycopg2.connect(DB_CONFIG)\n    register_vector(conn)\n    cur = conn.cursor()\n    \n    # 1. Tạo document record\n    cur.execute(\"\"\"\n        INSERT INTO clinical_guideline_documents (code, title, published_year, specialty)\n        VALUES (%s, %s, %s, %s)\n        ON CONFLICT (code) DO UPDATE SET title = EXCLUDED.title\n        RETURNING id;\n    \"\"\", (doc_code, title, year, specialty))\n    document_id = cur.fetchone()[0]\n    \n    # 2. Extract & Chunking\n    chunks = extract_and_chunk_pdf(pdf_path, title)\n    print(f\"Đang xử lý {len(chunks)} chunks cho tài liệu: {title}...\")\n    \n    # 3. Vectorize & Insert vào pgvector\n    for idx, c in enumerate(chunks):\n        vector = get_embedding(c[\"content\"])\n        metadata = json.dumps({\"source\": doc_code, \"specialty\": specialty})\n        \n        cur.execute(\"\"\"\n            INSERT INTO clinical_guideline_chunks (document_id, section_title, content, metadata, embedding)\n            VALUES (%s, %s, %s, %s, %s)\n        \"\"\", (document_id, c[\"section_title\"], c[\"content\"], metadata, vector))\n        print(f\" -> Đã nạp Chunk {idx+1}/{len(chunks)}: {c['section_title'][:40]}...\")\n        \n    conn.commit()\n    cur.close()\n    conn.close()\n    print(f\"✅ Hoàn tất nạp văn bản: {title} vào pgvector!\")\n\nif __name__ == \"__main__\":\n    # Ví dụ nạp phác đồ sốt xuất huyết\n    # ingest_to_database(\"tailieu/QD-4068-BYT-DENGUE.pdf\", \"BYT-4068\", \"Hướng dẫn điều trị Sốt xuất huyết Dengue\", \"TRUYEN_NHIEM\", 2023)\n    pass\n```\n\n---\n\n### 9.5. [Phase 3 & 4: Retrieval & Augmentation] Xây Dựng Backend Service & Prompt Guardrails\n\n#### 1. Repository Thực Hiện Hybrid Search Trong Spring Boot:\n```java\npackage com.careflow.ai.rag.repository;\n\nimport com.careflow.ai.rag.entity.ClinicalGuidelineChunk;\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\nimport org.springframework.stereotype.Repository;\n\nimport java.util.List;\nimport java.util.UUID;\n\n@Repository\npublic interface ClinicalGuidelineRepository extends JpaRepository<ClinicalGuidelineChunk, UUID> {\n\n    @Query(value = \"\"\"\n        SELECT c.* FROM clinical_guideline_chunks c\n        JOIN clinical_guideline_documents d ON d.id = c.document_id\n        WHERE (:specialty IS NULL OR d.specialty = :specialty)\n        ORDER BY c.embedding <=> CAST(:queryEmbedding AS vector)\n        LIMIT :limit\n    \"\"\", nativeQuery = true)\n    List<ClinicalGuidelineChunk> searchNearestChunks(\n        @Param(\"queryEmbedding\") String queryEmbedding,\n        @Param(\"specialty\") String specialty,\n        @Param(\"limit\") int limit\n    );\n}\n```\n\n#### 2. Dịch Vụ `ClinicalRagService.java` Điều Phối Lấy Context & Gọi Gemini:\n```java\npackage com.careflow.ai.rag.service;\n\nimport com.careflow.ai.rag.entity.ClinicalGuidelineChunk;\nimport com.careflow.ai.rag.repository.ClinicalGuidelineRepository;\nimport com.google.genai.Client;\nimport lombok.RequiredArgsConstructor;\nimport org.springframework.stereotype.Service;\n\nimport java.util.List;\nimport java.util.stream.Collectors;\n\n@Service\n@RequiredArgsConstructor\npublic class ClinicalRagService {\n\n    private final ClinicalGuidelineRepository repository;\n    private final EmbeddingClientService embeddingService;\n    private final Client geminiClient;\n\n    public String generateClinicalGuidance(String doctorQuery, String specialty, String clinicalSnapshotJson) {\n        // 1. Chuyển câu hỏi của bác sĩ thành Vector Embedding 768 chiều\n        float[] queryVector = embeddingService.embedQuery(doctorQuery);\n        String vectorString = formatVectorForSql(queryVector);\n\n        // 2. Truy xuất Top 3 phác đồ liên quan nhất từ pgvector\n        List<ClinicalGuidelineChunk> topChunks = repository.searchNearestChunks(vectorString, specialty, 3);\n\n        // 3. Ghép nối Context tri thức có trích dẫn nguồn\n        St
