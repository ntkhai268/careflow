server:
  port: 8092

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: ai-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  threads:
    virtual:
      enabled: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY:}
  model-id: ${ELEVENLABS_MODEL_ID:scribe_v1}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

careflow:
  voice:
    enabled: ${VOICE_PRESCRIPTION_ENABLED:false}
    content-key: ${AI_CONTENT_KEY:}
    jdbc-url: ${VOICE_DB_URL:jdbc:postgresql://100.116.233.60:5432/careflow_ai}
    db-user: ${VOICE_DB_USER:}
    db-password: ${VOICE_DB_PASSWORD:}
    identity-url: ${VOICE_IDENTITY_URL:https://careflow-identity-service:8081}
    consultation-url: ${VOICE_CONSULTATION_URL:https://careflow-consultation-service:8086}
    prescription-url: ${VOICE_PRESCRIPTION_URL:https://careflow-prescription-service:8087}
    worker-url: ${VOICE_WORKER_URL:https://voice-worker:8770}
    worker-token: ${VOICE_WORKER_TOKEN:}
    caller-name: ai-service
    caller-key: ${VOICE_CALLER_KEY:}
    allow-loopback-http: ${VOICE_ALLOW_LOOPBACK_HTTP:false}
    queue-capacity: 8
    per-doctor-capacity: 2
    ttl-seconds: 900
    dependency-timeout-seconds: 5
    inference-timeout-seconds: 210

  clinical:
    enabled: ${CLINICAL_AI_ENABLED:false}
    content-key: ${AI_CONTENT_KEY:}
    retention-days: ${AI_CONTENT_RETENTION_DAYS:7}
    allow-synthetic: ${AI_ALLOW_SYNTHETIC:false}
