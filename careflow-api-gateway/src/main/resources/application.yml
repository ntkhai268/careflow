server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 20MB
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - name: RequestSize
          args:
            maxSize: 20MB
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**, /api/health-records/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**
        - id: queue-service
          uri: lb://queue-service
          predicates:
            - Path=/api/queues/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /ws/**
        - id: consultation-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/consultations/**
        - id: prescription-service
          uri: lb://prescription-service
          predicates:
            - Path=/api/prescriptions/**
        - id: emr-service
          uri: lb://emr-service
          predicates:
            - Path=/api/emr/**
        - id: lab-service
          uri: lb://lab-service
          predicates:
            - Path=/api/labs/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
        - id: hospital-directory-service
          uri: lb://hospital-directory-service
          predicates:
            - Path=/api/directory/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

jwt:
  secret: ${JWT_SECRET:careflow_super_secret_jwt_key_2026_very_long_secret_key_minimum_256_bits}
  issuer: careflow-identity
