name: R7 candidate verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careflow_test
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:15432:5432
        options: >-
          --health-cmd "pg_isready -U careflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test evidence and restore guards
        run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Enable all isolated PostgreSQL regressions
        env:
          CAREFLOW_TEST_DB_PASSWORD: ci-fixture-only
        run: >-
          python3 scripts/release/verify_backend.py --db-user careflow_test
          --postgres-container '${{ job.services.postgres.id }}'
          --output-dir '${{ runner.temp }}/careflow-r7'
      - name: Inventory production dependencies
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=false
      - name: Check dependency conditions and forbidden surfaces
        run: python3 scripts/security/audit_backend_dependencies.py target/bom.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/doctor-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/doctor-web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node ../../scripts/security/test_web_session_memory.cjs
      - run: npm run build -- --webpack
