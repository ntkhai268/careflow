name: Eureka Infrastructure CI

on:
  push:
    branches:
      - feature/dangkhoii/eureka-infrastructure
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      RABBITMQ_PASSWORD: ci-rabbitmq-password
      EUREKA_USERNAME: ci-discovery
      EUREKA_PASSWORD: ci-eureka-password
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validate Compose contracts
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.infra.yml config --quiet

      - name: Build hardened Eureka image
        run: docker build --build-arg MODULE=careflow-eureka-server --tag careflow-eureka-server:ci .
