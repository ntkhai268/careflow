name: Deploy Frontend (Doctor Web)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/doctor-web/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and deploy doctor-web
        run: |
          echo "🔨 Building doctor-web..."
          docker-compose up --build -d careflow-doctor-web
          echo "✅ Doctor-web deployed successfully!"

      - name: Health check
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
