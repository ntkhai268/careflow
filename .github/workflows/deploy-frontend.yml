name: Validate and deploy secure doctor web
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/doctor-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/doctor-web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node ../../scripts/security/test_web_session_memory.cjs
      - run: npx tsc --noEmit
      - run: npm run build
  deploy:
    needs: verify
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
    concurrency:
      group: careflow-production-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require full R7 acceptance for this source
        shell: bash
        run: >-
          python3 scripts/release/acceptance_gate.py
          .planning/deployment/evidence/r7-20261021/cases.json
          --verify-source --output "$RUNNER_TEMP/careflow-r7-acceptance.json"
      - name: Deploy the secure web manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CAREFLOW_PRODUCTION_ENV_FILE:-}"
          test -r "$CAREFLOW_PRODUCTION_ENV_FILE"
          docker compose --env-file "$CAREFLOW_PRODUCTION_ENV_FILE" -f docker-compose.security.yml config --quiet
          docker compose --env-file "$CAREFLOW_PRODUCTION_ENV_FILE" -f docker-compose.security.yml up --build -d --wait --wait-timeout 180 careflow-doctor-web
