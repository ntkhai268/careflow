name: Validate and deploy secure backend
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend regression suite
        run: mvn -B verify
      - name: Generate artifact dependency inventory
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=false
      - name: Dependency and conditional surface gates
        run: python3 scripts/security/audit_backend_dependencies.py target/bom.json
      - name: Reject whitespace errors
        run: git diff --check
  deploy:
    needs: verify
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
    concurrency:
      group: careflow-production-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate private production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CAREFLOW_PRODUCTION_ENV_FILE:-}"
          test -r "$CAREFLOW_PRODUCTION_ENV_FILE"
          docker compose --env-file "$CAREFLOW_PRODUCTION_ENV_FILE" -f docker-compose.security.yml config --quiet
      - name: Deploy secure services
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$CAREFLOW_PRODUCTION_ENV_FILE" -f docker-compose.security.yml up --build -d --wait --wait-timeout 180
          docker compose --env-file "$CAREFLOW_PRODUCTION_ENV_FILE" -f docker-compose.security.yml ps
