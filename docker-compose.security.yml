        "SPRING_RABBITMQ_SSL_TRUST_STORE_PASSWORD": "${TLS_TRUSTSTORE_PASSWORD:?}",
        "SECURITY_FILE_SCANNER_HOST": "clamav",
        "SECURITY_FILE_SCAN_REQUIRED": "true",
        "FILE_UPLOAD_DIR": "/app/uploads/health-records"
