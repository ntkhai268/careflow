{
  "name": "careflow-secure",
  "services": {
    "careflow-api-gateway": {
      "build": {
        "context": ".",
        "dockerfile": "careflow-api-gateway/Dockerfile"
      },
      "environment": {
        "SPRING_PROFILES_ACTIVE": "secure,production",
        "SERVER_PORT": "8080",
        "SECURITY_CALLER_KEY": "${API_GATEWAY_CALLER_KEY:?}",
        "CAREFLOW_TLS_KEYSTORE_PASSWORD": "${API_GATEWAY_TLS_PASSWORD:?}",
        "CAREFLOW_TLS_TRUSTSTORE_PASSWORD": "${TLS_TRUSTSTORE_PASSWORD:?}",
        "SECURITY_DPOP_PUBLIC_ORIGINS": "${CAREFLOW_API_ORIGIN:?}",
        "SERVER_SSL_CLIENT_AUTH": "none",
        "CAREFLOW_WEB_ORIGIN": "${CAREFLOW_WEB_ORIGIN:?}",
        "SERVER_MAX_HTTP_REQUEST_HEADER_SIZE": "16KB",
        "SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_CONNECT_TIMEOUT": "5000",
        "SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_RESPONSE_TIMEOUT": "20s",
        "SERVER_FORWARD_HEADERS_STRATEGY": "none",
        "SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_SSL_KEY_STORE": "file:/run/secrets/tls.p12",
        "SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_SSL_KEY_STORE_TYPE": "PKCS12",
        "SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_SSL_KEY_STORE_PASSWORD": "${API_GATEWAY_TLS_PASSWORD:?}",
        "SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_SSL_KEY_PASSWORD": "${API_GATEWAY_TLS_PASSWORD:?}",
        "SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_SSL_TRUSTED_X509_CERTIFICATES_0": "file:/run/secrets/ca.crt"
      },
      "volumes": [
        "${CAREFLOW_SECURITY_DIR:?}/api-gateway.p12:/run/secrets/tls.p12:ro",
        "${CAREFLOW_SECURITY_DIR:?}/truststore.p12:/run/secrets/truststore.p12:ro",
        "${CAREFLOW_SECURITY_DIR:?}/ca.crt:/run/secrets/ca.crt:ro"
      ],
      "networks": [
        "careflow-private"
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "ports": [
        "${CAREFLOW_GATEWAY_BIND:-127.0.0.1}:${CAREFLOW_GATEWAY_PORT:-8443}:8080"
      ]
    },
    "careflow-identity-service": {
      "build": {
        "context": ".",
        "dockerfile": "careflow-identity-service/Dockerfile"
      },
      "environment": {
        "SPRING_PROFILES_ACTIVE": "secure,production",
        "SERVER_PORT": "8081",
        "SECURITY_CALLER_KEY": "${IDENTITY_CALLER_KEY:?}",
        "CAREFLOW_TLS_KEYSTORE_PASSWORD": "${IDENTITY_TLS_PASSWORD:?}",
        "CAREFLOW_TLS_TRUSTSTORE_PASSWORD": "${TLS_TRUSTSTORE_PASSWORD:?}",
        "SECURITY_DPOP_PUBLIC_ORIGINS": "${CAREFLOW_API_ORIGIN:?}",
        "SECURITY_JWT_PRIVATE_KEY_FILE": "/run/secrets/jwt-private.pem",
        "SECURITY_JWT_PUBLIC_KEY_FILE": "/run/secrets/jwt-public.pem",
        "SECURITY_JWT_KEY_ID": "${JWT_KEY_ID:?}",
        "SECURITY_CALLERS_JSON": "${SECURITY_CALLERS_JSON:?}",
        "SPRING_DATASOURCE_URL": "${IDENTITY_DB_URL:-jdbc:postgresql://100.116.233.60:5432/careflow_identity?sslmode=verify-full&sslrootcert=/run/secrets/db-ca.crt}",
        "SPRING_DATASOURCE_USERNAME": "${IDENTITY_DB_USERNAME:?}",
        "SPRING_DATASOURCE_PASSWORD": "${IDENTITY_DB_PASSWORD:?}",
        "SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE": "5",
        "SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE": "1",
        "SPRING_JPA_SHOW_SQL": "false",
        "RESEND_API_KEY": "${RESEND_API_KEY:?}",
        "RESEND_FROM": "CareFlow <careflow@supersignal-resend.id.vn>",
        "RECOVERY_OUTBOX_KEY_FILE": "/run/secrets/recovery-outbox.key",
        "SECURITY_AUTH_REQUIRE_STAFF_PASSKEY": "true",
        "SECURITY_AUTH_PUBLIC_REGISTRATION_ENABLED": "false",
        "SECURITY_PASSKEY_RP_ID": "${CAREFLOW_PASSKEY_RP_ID:?}",
        "SECURITY_PASSKEY_ORIGINS": "${CAREFLOW_WEB_ORIGIN:?}"
      },
      "volumes": [
        "${CAREFLOW_SECURITY_DIR:?}/identity-service.p12:/run/secrets/tls.p12:ro",
        "${CAREFLOW_SECURITY_DIR:?}/truststore.p12:/run/secrets/truststore.p12:ro",
        "${CAREFLOW_SECURITY_DIR:?}/ca.crt:/run/secrets/ca.crt:ro",
        "${CAREFLOW_SECURITY_DIR:?}/jwt-private.pem:/run/secrets/jwt-private.pem:ro",
        "${CAREFLOW_SECURITY_DIR:?}/jwt-public.pem:/run/secrets/jwt-public.pem:ro",
        "${CAREFLOW_SECURITY_DIR:?}/recovery-outbox.key:/run/secrets/recovery-outbox.key:ro",
        "${CAREFLOW_SECURITY_DIR:?}/db-ca.crt:/run/secrets/db-ca.crt:ro"
      ],
      "networks": [
        "careflow-private"
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
