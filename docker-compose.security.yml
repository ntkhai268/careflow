        "${CAREFLOW_SECURITY_DIR:?}/db-ca.crt:/run/secrets/db-ca.crt:ro",
        "patient-files:/app/uploads/health-records"
      ],
      "networks": [
        "careflow-private"
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ]
