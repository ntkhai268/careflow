      "volumes": [
        "${CAREFLOW_SECURITY_DIR:?}/patient-service.p12:/run/secrets/tls.p12:ro",
        "${CAREFLOW_SECURITY_DIR:?}/truststore.p12:/run/secrets/truststore.p12:ro",
