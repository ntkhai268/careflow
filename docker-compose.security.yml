        "SPRING_RABBITMQ_HOST": "${RABBITMQ_HOST:?}",
        "SPRING_RABBITMQ_PORT": "${RABBITMQ_PORT:-5671}",
        "SPRING_RABBITMQ_USERNAME": "${PATIENT_RABBITMQ_USERNAME:?}",
        "SPRING_RABBITMQ_PASSWORD": "${PATIENT_RABBITMQ_PASSWORD:?}",
        "SPRING_RABBITMQ_SSL_ENABLED": "true",
