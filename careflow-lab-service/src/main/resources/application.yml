server:
  port: 8089

spring:
  application:
    name: lab-service
  datasource:
    url: ${LAB_DB_URL:jdbc:postgresql://localhost:5432/careflow_lab}
    username: ${LAB_DB_USERNAME:careflow}
    password: ${LAB_DB_PASSWORD:careflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:admin}}
    password: ${RABBITMQ_PASSWORD:admin123}
    publisher-confirm-type: correlated
    publisher-returns: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
