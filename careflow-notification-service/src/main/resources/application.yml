server:
  port: 8085

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:careflow}
    password: ${RABBITMQ_PASSWORD:careflow}
  threads:
    virtual:
      enabled: true

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: "${EUREKA_URL:http://careflow:careflow@localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
