server:
  port: 8087

spring:
  application:
    name: prescription-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:100.116.233.60}:${DB_PORT:5432}/careflow_prescription}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:careflow}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:careflow}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
