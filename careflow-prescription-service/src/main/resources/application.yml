server:
  port: 8087

spring:
  application:
    name: prescription-service
  datasource:
    url: jdbc:postgresql://localhost:5432/careflow_prescription
    username: careflow
    password: careflow
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:careflow}
    password: ${RABBITMQ_PASSWORD:careflow}
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
