services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [careflow-network]

  eureka-server:
    build:
      context: .
      args:
        MODULE: careflow-eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/"]
      interval: 5s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs: [/tmp]
    init: true
    mem_limit: 512m
    restart: unless-stopped
    networks: [careflow-network]

  identity-service:
    build:
      context: .
      args:
        MODULE: careflow-identity-service
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/careflow_identity
      IDENTITY_DB_USERNAME: careflow
      IDENTITY_DB_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    init: true
    mem_limit: 768m
    restart: unless-stopped
    networks: [careflow-network]

  api-gateway:
    build:
      context: .
      args:
        MODULE: careflow-api-gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    init: true
    mem_limit: 512m
    restart: unless-stopped
    networks: [careflow-network]

volumes:
  postgres_data:

networks:
  careflow-network:
    driver: bridge
