services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: careflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-careflow}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka-server:
    build:
      context: .
      args:
        MODULE: careflow-eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/"]
      interval: 5s
      timeout: 3s
      retries: 30

  identity-service:
    build:
      context: .
      args:
        MODULE: careflow-identity-service
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/careflow_identity
      IDENTITY_DB_USERNAME: careflow
      IDENTITY_DB_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: careflow
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-careflow}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  queue-service:
    build:
      context: .
      args:
        MODULE: careflow-queue-service
    environment:
      QUEUE_DB_URL: jdbc:postgresql://postgres:5432/careflow_queue
      QUEUE_DB_USERNAME: careflow
      QUEUE_DB_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: careflow
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-careflow}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      QUEUE_BUSINESS_ZONE: Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        MODULE: careflow-notification-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: careflow
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-careflow}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      args:
        MODULE: careflow-api-gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_started
      queue-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
