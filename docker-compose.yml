services:
  # ==================== SERVICE DISCOVERY ====================
  careflow-eureka-server:
    build:
      context: .
      dockerfile: careflow-eureka-server/Dockerfile
    container_name: careflow-eureka-server
    ports:
      - "8761:8761"
    networks:
      - careflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== API GATEWAY ====================
  careflow-api-gateway:
    build:
      context: .
      dockerfile: careflow-api-gateway/Dockerfile
    container_name: careflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-careflow-demo-jwt-secret-key-2026-must-be-at-least-256-bits-long}
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  # ==================== BUSINESS SERVICES ====================
  careflow-identity-service:
    build:
      context: .
      dockerfile: careflow-identity-service/Dockerfile
    container_name: careflow-identity-service
    ports:
      - "8081:8081"
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://careflow-postgres:5432/careflow_identity
      IDENTITY_DB_USERNAME: ${POSTGRES_USER:-careflow}
      IDENTITY_DB_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_URL: http://careflow-eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-careflow-demo-jwt-secret-key-2026-must-be-at-least-256-bits-long}
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-patient-service:
    build:
      context: .
      dockerfile: careflow-patient-service/Dockerfile
    container_name: careflow-patient-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_patient
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-appointment-service:
    build:
      context: .
      dockerfile: careflow-appointment-service/Dockerfile
    container_name: careflow-appointment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_appointment
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-queue-service:
    build:
      context: .
      dockerfile: careflow-queue-service/Dockerfile
    container_name: careflow-queue-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_queue
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-careflow-demo-jwt-secret-key-2026-must-be-at-least-256-bits-long}
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-notification-service:
    build:
      context: .
      dockerfile: careflow-notification-service/Dockerfile
    container_name: careflow-notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_notification
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-careflow-demo-jwt-secret-key-2026-must-be-at-least-256-bits-long}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-consultation-service:
    build:
      context: .
      dockerfile: careflow-consultation-service/Dockerfile
    container_name: careflow-consultation-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_consultation
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-prescription-service:
    build:
      context: .
      dockerfile: careflow-prescription-service/Dockerfile
    container_name: careflow-prescription-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_prescription
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-emr-service:
    build:
      context: .
      dockerfile: careflow-emr-service/Dockerfile
    container_name: careflow-emr-service
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_emr
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-lab-service:
    build:
      context: .
      dockerfile: careflow-lab-service/Dockerfile
    container_name: careflow-lab-service
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://careflow-postgres:5432/careflow_lab
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-careflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  careflow-ai-service:
    build:
      context: .
      dockerfile: careflow-ai-service/Dockerfile
    container_name: careflow-ai-service
    ports:
      - "8090:8090"
    environment:
      SPRING_RABBITMQ_HOST: careflow-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://careflow-eureka-server:8761/eureka/
    depends_on:
      careflow-eureka-server:
        condition: service_healthy
    networks:
      - careflow-net
    restart: unless-stopped

  # ==================== FRONTEND ====================
  careflow-doctor-web:
    build:
      context: ./frontend/doctor-web
      dockerfile: Dockerfile
    container_name: careflow-doctor-web
    ports:
      - "3000:3000"
    networks:
      - careflow-net
    restart: unless-stopped

networks:
  careflow-net:
    name: careflow-net
    external: true
