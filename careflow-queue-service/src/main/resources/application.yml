server:
  port: 8084

spring:
  application:
    name: queue-service
  datasource:
    url: ${QUEUE_DB_URL:jdbc:postgresql://localhost:5432/careflow_queue}
    username: ${QUEUE_DB_USERNAME:careflow}
    password: ${QUEUE_DB_PASSWORD:careflow}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    out-of-order: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:careflow_jwt_secret_key_for_development_and_testing_2026_must_be_at_least_256_bits!}

queue:
  business-zone: ${QUEUE_BUSINESS_ZONE:Asia/Ho_Chi_Minh}
  qr-secret: ${QR_SECRET:careflow_jwt_secret_key_for_development_and_testing_2026_must_be_at_least_256_bits!}
  qr-expiration-minutes: ${QR_EXPIRATION_MINUTES:30}
  geofence:
    site-id: ${HOSPITAL_GEOFENCE_SITE_ID:HOSPITAL-MAIN}
    latitude: ${HOSPITAL_GEOFENCE_LATITUDE:10.7769}
    longitude: ${HOSPITAL_GEOFENCE_LONGITUDE:106.7009}
    radius-meters: ${HOSPITAL_GEOFENCE_RADIUS_METERS:150}
    max-accuracy-meters: ${HOSPITAL_GEOFENCE_MAX_ACCURACY_METERS:50}
  outbox-poll-ms: ${OUTBOX_POLL_MS:1000}
  outbox-max-attempts: ${OUTBOX_MAX_ATTEMPTS:12}
