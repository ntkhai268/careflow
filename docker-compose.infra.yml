services:
  postgres:
    image: postgres:16-alpine
    container_name: careflow-postgres
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - careflow-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: careflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: careflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-careflow}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - careflow-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  careflow-network:
    driver: bridge
