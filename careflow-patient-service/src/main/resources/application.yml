server:
  port: 8082
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

spring:
  application:
    name: patient-service
  datasource:
    url: ${PATIENT_DB_URL:jdbc:postgresql://localhost:5432/careflow_patient}
    username: ${PATIENT_DB_USERNAME:careflow}
    password: ${PATIENT_DB_PASSWORD:careflow}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:admin}}
    password: ${RABBITMQ_PASSWORD:admin123}
  threads:
    virtual:
      enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/health-records}
