server:
  port: 8082

spring:
  application:
    name: patient-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careflow_patient}
    username: ${DB_USERNAME:careflow}
    password: ${DB_PASSWORD:careflow}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:careflow}
    password: ${RABBITMQ_PASSWORD:careflow}
  threads:
    virtual:
      enabled: true

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: "${EUREKA_URL:http://careflow:careflow@localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
